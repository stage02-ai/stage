<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U.S. Rio A.S.D.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Intestazione, menu orizzontale ===== -->
  <header class="topnav">
    <div class="topnav-inner">
      <a href="#" class="brand" data-view="home">
        <img src="img/logo.png" alt="Stemma U.S. Rio" class="crest">
        <span class="brand-text">
          <span class="brand-name">U.S. Rio</span>
          <span class="brand-sub">A.S.D. &middot; Affiliata Calcio Padova</span>
        </span>
      </a>

      <nav class="menu">
        <button class="menu-item" data-view="home">Home</button>
        <button class="menu-item" data-view="societa">Società</button>
        <button class="menu-item" data-view="squadre">Squadre</button>
        <button class="menu-item" data-view="bacheca">Bacheca</button>
        <button class="menu-item" data-view="contatti">Contatti</button>
      </nav>

      <button class="menu-toggle" id="menuToggle" aria-label="Apri menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== Menu a tutto schermo per mobile ===== -->
  <div class="mobile-menu" id="mobileMenu">
    <nav class="mobile-menu-list">
      <button class="mobile-menu-item" data-view="home">Home</button>
      <button class="mobile-menu-item" data-view="societa">Società</button>
      <button class="mobile-menu-item" data-view="squadre">Squadre</button>
      <button class="mobile-menu-item" data-view="bacheca">Bacheca</button>
      <button class="mobile-menu-item" data-view="contatti">Contatti</button>
    </nav>
  </div>

  <main id="content" class="content"></main>

  <footer class="footer">
    <p>U.S. Rio A.S.D. &middot; Affiliata Calcio Padova &middot; Progetto stage</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
