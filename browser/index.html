function viewSquadreGiocatori() {
  // Chi è entrato come Giocatore vede solo la propria scheda, non
  // l'elenco di tutti i giocatori (quello resta solo per l'Admin).
  if (accesso && accesso.ruolo === 'giocatore') { return viewGiocatoreSingolo(); }

  var isAdmin = !!(accesso && accesso.ruolo === 'admin');
  var vistaArchiviati = giocatoriVista === 'archiviati';
  if (!vistaArchiviati && giocatoriCache === null) { fetchGiocatori(); }
  if (vistaArchiviati && giocatoriArchiviatiCache === null) { fetchGiocatoriArchiviati(); }
  if (isAdmin && teamsCache === null) { fetchTeams(); } // serve per il menu "Squadra" del modulo Nuovo giocatore

  var elenco = vistaArchiviati ? giocatoriArchiviatiCache : giocatoriCache;
  var ricercaAttiva = isAdmin && giocatoriRicerca.trim() !== '';
  if (isAdmin && Array.isArray(elenco) && ricercaAttiva) {
    var testoRicerca = giocatoriRicerca.trim().toLowerCase();
    elenco = elenco.filter(function (p) {
      return [p.nome, p.cognome, p.squadra].some(function (campo) {
        return campo && String(campo).toLowerCase().indexOf(testoRicerca) !== -1;
      });
    });
  }

  var body;
  if (elenco === null || elenco === 'loading') {
    body = '<p style="color:var(--ink-muted);">Caricamento giocatori dal database&hellip;</p>';
  } else if (elenco.error) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Errore.</strong> Non &egrave; stato possibile leggere i giocatori dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else if (!elenco.length && !(isAdmin && !vistaArchiviati && (nuovoGiocatoreAperto || giocatoreRapidoAperto))) {
    body = '<div class="qcard">' + (ricercaAttiva ? 'Nessun giocatore trovato per questa ricerca.' : (vistaArchiviati ? 'Nessun giocatore archiviato.' : 'Nessun giocatore trovato nel database.')) + '</div>';
  } else {
    var rows = elenco.map(function (p) {
      if (!vistaArchiviati && isAdmin && String(giocatoreInModificaId) === String(p.id)) {
        return giocatoreModificaCardHtml(p);
      }
      if (!vistaArchiviati && isAdmin && String(giocatoreDaEliminareId) === String(p.id)) {
        return giocatoreEliminaCardHtml(p);
      }
      if (vistaArchiviati && isAdmin && String(giocatoreDaRipristinareId) === String(p.id)) {
        return giocatoreRipristinaCardHtml(p);
      }
      if (vistaArchiviati && isAdmin && String(giocatoreDaEliminareDefinitivamenteId) === String(p.id)) {
        return giocatoreEliminaDefinitivamenteCardHtml(p);
      }
      var nomeCompleto = escapeHtml(p.cognome) + ' ' + escapeHtml(p.nome);
      return '' +
      '<div class="qcard cert-row" style="flex-direction:row;">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + nomeCompleto + '</div>' +
        '<ul style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;margin:0;padding-left:18px;">' +
          '<li>Squadra: ' + (p.squadra ? escapeHtml(p.squadra) : '&mdash;') + '</li>' +
          '<li>Anno di nascita: ' + (p.anno_nascita ? escapeHtml(p.anno_nascita) : '&mdash;') + '</li>' +
        '</ul>' +
        (isAdmin && !vistaArchiviati ? '' +
          '<div class="right-cluster">' +
            (p.registrazione_in_attesa ? '' +
              '<span class="badge badge-none" style="font-size:.72rem;">' + (p.registrazione_scaduta ? 'Link scaduto' : 'In attesa di registrazione') + '</span>' +
              '<span class="pill" style="font-size:.78rem;cursor:' + (String(giocatoreLinkInCorsoId) === String(p.id) ? 'default' : 'pointer') + ';opacity:' + (String(giocatoreLinkInCorsoId) === String(p.id) ? '.6' : '1') + ';" title="Genera un nuovo link da mandare al giocatore (quello di prima, se c\'era, smette subito di funzionare)" onclick="' + (String(giocatoreLinkInCorsoId) === String(p.id) ? '' : 'generaLinkRegistrazione(' + JSON.stringify(p.id) + ', ' + JSON.stringify(p.nome) + ', ' + JSON.stringify(p.cognome) + ')') + '">' + (String(giocatoreLinkInCorsoId) === String(p.id) ? 'Genero&hellip;' : 'Genera nuovo link') + '</span>'
            : (!p.accesso_attivo ? '' +
              '<span class="pill" style="font-size:.78rem;cursor:' + (String(giocatoreInvitoInCorsoId) === String(p.id) ? 'default' : 'pointer') + ';opacity:' + (String(giocatoreInvitoInCorsoId) === String(p.id) ? '.6' : '1') + ';" title="Manda l\'email per scegliere la password" onclick="' + (String(giocatoreInvitoInCorsoId) === String(p.id) ? '' : 'inviaAccessoGiocatore(' + JSON.stringify(p.id) + ')') + '">' + (String(giocatoreInvitoInCorsoId) === String(p.id) ? 'Invio&hellip;' : 'Manda accesso') + '</span>'
            : '')) +
            '<span class="icon-btn" title="Modifica giocatore" onclick="apriModificaGiocatore(' + JSON.stringify(p.id) + ')">' + ICONS.edit + '</span>' +
            '<span class="icon-btn" title="Elimina giocatore" onclick="chiediEliminaGiocatore(' + JSON.stringify(p.id) + ')">' + ICONS.trash + '</span>' +
          '</div>' : '') +
        (isAdmin && vistaArchiviati ? '' +
          '<div class="right-cluster">' +
            '<span class="icon-btn" title="Ripristina giocatore" onclick="apriRipristinaGiocatore(' + JSON.stringify(p.id) + ')">' + ICONS.restore + '</span>' +
            '<span class="icon-btn" title="Elimina definitivamente" onclick="chiediEliminaGiocatoreDefinitivamente(' + JSON.stringify(p.id) + ')">' + ICONS.trash + '</span>' +
          '</div>' : '') +
      '</div>';
    }).join('');
    if (!vistaArchiviati && isAdmin && giocatoreRapidoAperto) { rows = giocatoreRapidoCardHtml() + rows; }
    if (!vistaArchiviati && isAdmin && nuovoGiocatoreAperto) { rows = nuovoGiocatoreCardHtml() + rows; }
    body = '<div class="list">' + rows + '</div>';
  }

  var filtriHtml = isAdmin ? '' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px;">' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        filtroGiocatoriBtn('attivi', 'Attivi') +
        filtroGiocatoriBtn('archiviati', 'Archiviati') +
      '</div>' +
      '<input type="text" id="ricercaGiocatoriInput" value="' + escapeHtml(giocatoriRicerca) + '" oninput="onRicercaGiocatoriChange(event)" placeholder="Cerca per nome, cognome o squadra&hellip;" style="flex:1 1 240px;max-width:320px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--ink);">' +
    '</div>' : '';

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'squadre\')">' + ICONS.arrowLeft + ' Torna a Squadre</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Settore giovanile</span><h1 style="font-size:2rem;">Giocatori</h1>' +
    '<p class="subtitle">Tutti i giocatori della societ&agrave;, anche di squadre diverse.</p></div>' +
    (isAdmin && !vistaArchiviati ? '' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<span class="btn btn-outline" onclick="apriGiocatoreRapido()">' + ICONS.plus + ' Aggiungi con link WhatsApp</span>' +
        '<span class="btn btn-outline" onclick="apriNuovoGiocatore()">' + ICONS.plus + ' Nuovo giocatore</span>' +
      '</div>'
    : '') +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + filtriHtml + body + '</section>';
}

// Uno dei due pulsanti del filtro "Attivi / Archiviati" in cima
// all'elenco Giocatori (solo Admin): evidenziato se è quello scelto.
function filtroGiocatoriBtn(valore, etichetta) {
  var attivo = giocatoriVista === valore;
  return '' +
    '<span class="pill' + (attivo ? ' pill-solid' : '') + '" style="cursor:pointer;" onclick=\'impostaFiltroGiocatori(' +
      JSON.stringify(valore) + ')\'>' + escapeHtml(etichetta) + '</span>';

function impostaFiltroGiocatori(valore) {
  giocatoriVista = valore;
  giocatoreInModificaId = null;
  giocatoreDaEliminareId = null;
  giocatoreDaRipristinareId = null;
  render();
}

// cognome o squadra senza bisogno di richieste al server.
function onRicercaGiocatoriChange(e) {

  render();

// Campo di ricerca riutilizzato in Giocatori, Certificati > Gestione e
// Certificati > Archivio: id (per non perdere il focus a ogni lettera,

    '<div style="margin-bottom:18px;">' +

    '</div>';
}

function onRicercaGestioneChange(e) {
  gestioneRicerca = e.target.value;
  render();
}

// Barra di ricerca di Certificati > Archivio (solo Admin): filtra per
// nome o cognome del giocatore.
function onRicercaArchivioChange(e) {

// Barra di ricerca dello Storico segnalazioni (solo Admin): filtra per
// nome o cognome di chi ha caricato il certificato.

  render();

// Vista di "Giocatori" per chi è entrato come Giocatore: niente elenco
// di tutti i giocatori, solo la propria scheda (stesso approccio già
// usato per Certificati medici > Gestione, vedi viewCertificatoGestioneGiocatore).
function viewGiocatoreSingolo() {
  if (giocatoriCache === null) { fetchGiocatori(); }

  var body;
  if (giocatoriCache === null || giocatoriCache === 'loading') {
    body = '<p style="color:var(--ink-muted);">Caricamento&hellip;</p>';
  } else if (giocatoriCache.error) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Errore.</strong> Non &egrave; stato possibile leggere i dati dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else {
    var me = giocatoreLoggato();
    if (!me) {
      body = identitaGiocatoreCardHtml();
    } else {
      var nomeCompleto = escapeHtml(me.cognome) + ' ' + escapeHtml(me.nome);
      body = '<div class="list">' +
        '<div class="qcard cert-row" style="flex-direction:row;">' +
          '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + nomeCompleto + '</div>' +
          '<ul style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;margin:0;padding-left:18px;">' +
            '<li>Squadra: ' + (me.squadra ? escapeHtml(me.squadra) : '&mdash;') + '</li>' +
            '<li>Anno di nascita: ' + (me.anno_nascita ? escapeHtml(me.anno_nascita) : '&mdash;') + '</li>' +
          '</ul>' +
        '</div>' +
      '</div>';
    }
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'squadre\')">' + ICONS.arrowLeft + ' Torna a Squadre</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Settore giovanile</span><h1 style="font-size:2rem;">Giocatore</h1>' +
    '<p class="subtitle">La Sua scheda giocatore.</p></div>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + body + '</section>';
}

function viewSquadreElenco() {
  if (teamsCache === null) { fetchTeams(); }
  var perGiocatore = !!(accesso && accesso.ruolo === 'giocatore');
  if (perGiocatore && giocatoriCache === null) { fetchGiocatori(); }
  var isAdmin = !!(accesso && accesso.ruolo === 'admin');
  var mostraFormNuovaSquadra = isAdmin && nuovaSquadraAperta;

  var body;
  if (teamsCache === null || teamsCache === 'loading' || (perGiocatore && (giocatoriCache === null || giocatoriCache === 'loading'))) {
    body = '<p style="color:var(--ink-muted);">Caricamento squadre dal database&hellip;</p>';
  } else if ((teamsCache && teamsCache.error) || (perGiocatore && giocatoriCache.error)) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Squadre non disponibili.</strong> Non &egrave; stato possibile leggere le squadre dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else {
    // Chi è entrato come Giocatore vede solo le squadre di cui fa
    // davvero parte (può essere più di una), non tutte le categorie
    // della società.
    var squadreVisibili = teamsCache;
    var mioGiocatorePerSquadre = null;
    if (perGiocatore) {
      mioGiocatorePerSquadre = giocatoreLoggato();
      var idSquadreMie = mioGiocatorePerSquadre ? (mioGiocatorePerSquadre.squadre || []).map(function (s) { return String(s.id); }) : [];
      squadreVisibili = teamsCache.filter(function (t) { return idSquadreMie.indexOf(String(t.id)) !== -1; });
    }

    if (perGiocatore && !mioGiocatorePerSquadre) {
      body = identitaGiocatoreCardHtml();
    } else if (!squadreVisibili.length && !mostraFormNuovaSquadra) {
      body = '<p style="color:var(--ink-muted);">' + (perGiocatore ? 'Non risulta ancora collegato a nessuna squadra.' : 'Nessuna squadra trovata nel database.') + '</p>';
    } else {
    var cardsHtml = squadreVisibili.map(function (t) {
      if (isAdmin && String(squadraInModificaId) === String(t.id)) {
        return squadraModificaCardHtml(t);
      }
      if (isAdmin && String(squadraDaEliminareId) === String(t.id)) {
        return squadraEliminaCardHtml(t);
      }
      return '' +
      '<div class="qcard qcard-clickable" data-open-rosa data-team-id="' + escapeHtml(t.id) + '" data-team-name="' + escapeHtml(t.nome) + '">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;">' +
          '<div class="qcard-icon">' + ICONS.squadre + '</div>' +
          (isAdmin ? '' +
            '<div style="display:flex;gap:6px;">' +
              '<span class="icon-btn" title="Modifica nome" onclick="event.stopPropagation(); apriModificaSquadra(' + JSON.stringify(t.id) + ')">' + ICONS.edit + '</span>' +
              '<span class="icon-btn" title="Elimina squadra" onclick="event.stopPropagation(); chiediEliminaSquadra(' + JSON.stringify(t.id) + ')">' + ICONS.trash + '</span>' +
            '</div>' : '') +
        '</div>' +
        '<div><h3 style="font-size:1rem;">' + escapeHtml(t.nome) + '</h3>' +
        '<p style="color:var(--ink-muted);font-size:.86rem;margin-top:6px;">Rosa e informazioni della categoria.</p></div>' +
        '<div class="link-row">Gestisci rosa ' + ICONS.arrowRight + '</div>' +
      '</div>';
    }).join('');
      if (mostraFormNuovaSquadra) { cardsHtml += nuovaSquadraCardHtml(); }
      body = '<div class="grid3">' + cardsHtml + '</div>';
    }
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'squadre\')">' + ICONS.arrowLeft + ' Torna a Squadre</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Settore giovanile</span><h1 style="font-size:2rem;">Squadre</h1></div>' +
    (isAdmin ? '<span class="btn btn-outline" onclick="apriNuovaSquadra()">' + ICONS.plus + ' Nuova squadra</span>' : '') +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + body + '</section>';
}

function viewRosa(teamId) {
  if (rosterCache[teamId] === undefined) { fetchRoster(teamId); }
  if (teamsCache === null) { fetchTeams(); } // serve per mostrare il nome della squadra
  var roster = rosterCache[teamId];

  var teamName = 'Squadra';
  if (teamsCache && teamsCache.length) {
    var teamObj = teamsCache.filter(function (t) { return String(t.id) === String(teamId); })[0];
    if (teamObj) { teamName = teamObj.nome; }
  }

  var body;
  if (roster === undefined || roster === 'loading') {
    body = '<div class="qcard"><p style="color:var(--ink-muted);">Caricamento rosa dal database&hellip;</p></div>';
  } else if (roster && roster.error) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Errore.</strong> Non &egrave; stato possibile leggere i giocatori dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else if (!roster.length) {
    body = '<div class="qcard">Nessun giocatore trovato per questa squadra nel database.</div>';
  } else {
    var rows = roster.map(function (p) {
      var nomeCompleto = escapeHtml(p.cognome) + ' ' + escapeHtml(p.nome);
      return '' +
      '<div class="qcard cert-row" style="flex-direction:row;">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + nomeCompleto + '</div>' +
        '<ul style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;margin:0;padding-left:18px;">' +
          '<li>Anno di nascita: ' + (p.anno_nascita ? escapeHtml(p.anno_nascita) : '&mdash;') + '</li>' +
        '</ul>' +
      '</div>';
    }).join('');
    body = '<div class="list">' + rows + '</div>';
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'squadre/elenco\')">' + ICONS.arrowLeft + ' Torna a Squadre</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Squadre &middot; ' + escapeHtml(teamName) + '</span><h1 style="font-size:2rem;">Rosa</h1></div>' +
    ((accesso && accesso.ruolo === 'admin') ? '<span class="btn btn-outline" onclick=\'apriNuovoGiocatorePerSquadra(' + JSON.stringify(teamId) + ')\'>' + ICONS.plus + ' Aggiungi giocatore</span>' : '') +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + body + '</section>';
}

function viewContatti() {
  return '' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Info</span><h1 style="font-size:2rem;">Contatti</h1></div>' +
    '<span class="btn btn-outline">' + ICONS.edit + ' Modifica</span>' +

      '<div class="field-row"><span style="color:var(--ink-muted);font-size:.85rem;">Telefono</span><span style="font-weight:600;">[Numero]</span></div>' +

// ---------- pagina Impostazioni ----------
// Solo le preferenze personali di chi ha fatto accesso (per ora, il
// tema): le vede chiunque, Admin o Giocatore. Non c'è più una scheda
// "Impostazioni admin" separata: non c'era ancora nulla da gestire lì.

// Uno dei tre pulsanti Chiaro / Scuro / Automatico: evidenziato se è
// quello scelto al momento.
function temaBtn(valore, etichetta) {
  var attivo = tema === valore;
  return '' +
    '<span class="pill' + (attivo ? ' pill-solid' : '') + '" style="cursor:pointer;" onclick=\'impostaTema(' +
      JSON.stringify(valore) + ')\'>' + escapeHtml(etichetta) + '</span>';
}

// Cambia la scheda aperta nella pagina Impostazioni ('account',
// 'password' o 'aspetto'): stesso meccanismo già usato per le due
// schede di Segnalazioni (vedi cambiaTabSegnalazioni).
function cambiaTabImpostazioni(tab) {
  impostazioniTab = tab;
  render();
}

function viewImpostazioni() {
  var campoStileImpostazioni = 'width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);';

  var tabsHtml = '' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 4px;">' +
      '<span class="badge ' + (impostazioniTab === 'account' ? 'badge-ok' : 'badge-none') + '" style="cursor:pointer;" onclick="cambiaTabImpostazioni(\'account\')">Account</span>' +
      '<span class="badge ' + (impostazioniTab === 'password' ? 'badge-ok' : 'badge-none') + '" style="cursor:pointer;" onclick="cambiaTabImpostazioni(\'password\')">Password</span>' +
      '<span class="badge ' + (impostazioniTab === 'aspetto' ? 'badge-ok' : 'badge-none') + '" style="cursor:pointer;" onclick="cambiaTabImpostazioni(\'aspetto\')">Aspetto</span>' +
    '</div>';

  var contenutoHtml;
  if (impostazioniTab === 'password') {
    contenutoHtml = '' +
      '<div class="qcard" style="max-width:420px;">' +
        '<div>' +
          '<p style="font-weight:700;margin-bottom:4px;">Cambia password</p>' +
          '<p style="color:var(--ink-muted);font-size:.85rem;margin-bottom:14px;">Scelga una nuova password per accedere al sito.</p>' +
          '<div style="display:flex;flex-direction:column;gap:12px;">' +
            '<div><span class="field-label">Nuova password (almeno 8 caratteri)</span><input type="password" value="' + escapeHtml(impostazioniPasswordValore) + '" oninput="onImpostazioniPasswordChange(event)" style="' + campoStileImpostazioni + '"></div>' +
            '<div><span class="field-label">Ripeta la password</span><input type="password" value="' + escapeHtml(impostazioniPasswordConferma) + '" oninput="onImpostazioniPasswordConfermaChange(event)" onkeydown="if(event.key===\'Enter\'){confermaImpostazioniPassword();}" style="' + campoStileImpostazioni + '"></div>' +
            (impostazioniPasswordErrore ? '<p style="color:var(--late);font-size:.85rem;margin:0;">' + escapeHtml(impostazioniPasswordErrore) + '</p>' : '') +
            (impostazioniPasswordFatta ? '<p style="color:var(--ok);font-weight:700;font-size:.85rem;margin:0;">Password aggiornata.</p>' : '') +
            '<span class="pill pill-solid" style="cursor:pointer;align-self:flex-start;opacity:' + (impostazioniPasswordInCorso ? '.6' : '1') + ';" onclick="' + (impostazioniPasswordInCorso ? '' : 'confermaImpostazioniPassword()') + '">' + (impostazioniPasswordInCorso ? 'Salvataggio&hellip;' : 'Salva password') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else if (impostazioniTab === 'aspetto') {
    contenutoHtml = '' +
      '<div class="qcard" style="max-width:420px;">' +
        '<div>' +
          '<p style="font-weight:700;margin-bottom:4px;">Tema</p>' +
          '<p style="color:var(--ink-muted);font-size:.85rem;margin-bottom:14px;">Vale solo per questo dispositivo: ogni persona che apre il sito pu&ograve; scegliere il proprio.</p>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            temaBtn('chiaro', 'Chiaro') +
            temaBtn('scuro', 'Scuro') +
          '</div>' +
        '</div>' +
      '</div>';
  } else if (impostazioniAccountModificaAttiva) {
    contenutoHtml = '' +
      '<div class="qcard" style="max-width:420px;">' +
        '<div>' +
          '<p style="font-weight:700;margin-bottom:4px;">Modifica dati account</p>' +
          '<div style="display:flex;flex-direction:column;gap:12px;">' +
            '<div><span class="field-label">Nome</span><input type="text" value="' + escapeHtml(impostazioniAccountNome) + '" oninput="onImpostazioniAccountNomeChange(event)" style="' + campoStileImpostazioni + '"></div>' +
            '<div><span class="field-label">Cognome</span><input type="text" value="' + escapeHtml(impostazioniAccountCognome) + '" oninput="onImpostazioniAccountCognomeChange(event)" style="' + campoStileImpostazioni + '"></div>' +
            '<div><span class="field-label">Email di accesso</span><input type="email" value="' + escapeHtml(impostazioniAccountEmail) + '" oninput="onImpostazioniAccountEmailChange(event)" style="' + campoStileImpostazioni + '"></div>' +
            (impostazioniAccountErrore ? '<p style="color:var(--late);font-size:.85rem;margin:0;">' + escapeHtml(impostazioniAccountErrore) + '</p>' : '') +
            '<div style="display:flex;gap:10px;">' +
              '<span class="btn-reject" style="flex:1;" onclick="annullaModificaAccount()">Annulla</span>' +
              '<span class="btn-approve" style="flex:1;" onclick="' + (impostazioniAccountInCorso ? '' : 'confermaImpostazioniAccount()') + '">' + (impostazioniAccountInCorso ? 'Salvataggio&hellip;' : 'Salva') + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    contenutoHtml = '' +
      '<div class="qcard" style="max-width:420px;">' +
        '<div>' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">' +
            '<p style="font-weight:700;margin:0;">Il Suo account</p>' +
            '<span class="icon-btn" title="Modifica i Suoi dati" onclick="apriModificaAccount()">' + ICONS.edit + '</span>' +
          '</div>' +
          rigaDettaglio('Nome e cognome', accesso ? escapeHtml(accesso.cognome + ' ' + accesso.nome) : '') +
          rigaDettaglio('Email di accesso', accesso && accesso.email ? escapeHtml(accesso.email) : '') +
          rigaDettaglio('Ruolo', accesso && accesso.ruolo === 'admin' ? 'Admin' : 'Giocatore') +
          (impostazioniAccountFatta ? '<p style="color:var(--ok);font-weight:700;font-size:.85rem;margin:10px 0 0;">' + (impostazioniAccountEmailRichiesta ? 'Nome e cognome salvati. Le abbiamo mandato un\'email di conferma al nuovo indirizzo: il cambio dell\'email di accesso sar&agrave; attivo solo dopo aver cliccato sul link ricevuto.' : 'Dati aggiornati.') + '</p>' : '') +
        '</div>' +
      '</div>';
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Area personale</span><h1 style="font-size:2rem;">Impostazioni</h1></div>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + tabsHtml + contenutoHtml + '</section>';
}

// Scheda "Segnalazioni" nella pagina Certificati medici: solo per
// l'Admin, raccoglie in un unico posto le email automatiche del sito
// (segnalazioni di nomi non riconosciuti da gestire, e lo storico di
// tutte le notifiche mandate). Carichiamo subito le segnalazioni
// (se non le abbiamo già) solo per mostrare qui il numero di quelle
// ancora da gestire, come un piccolo promemoria.
function cardSegnalazioniHtml() {
  if (segnalazioniCache === null) { fetchSegnalazioni(); }
  var daGestire = (segnalazioniCache && segnalazioniCache.length)
    ? segnalazioniCache.filter(function (s) { return s.stato === 'in_attesa'; }).length
    : 0;

  return '' +
    '<div class="qcard qcard-clickable" onclick="navigate(\'certificati/segnalazioni\')">' +
      '<div class="qcard-icon">' + ICONS.bell + '</div>' +
      '<div><h3 style="font-size:1.1rem;">Segnalazioni' + (daGestire ? ' <span class="badge badge-pending" style="margin-left:6px;">' + daGestire + '</span>' : '') + '</h3>' +
      '<p style="color:var(--ink-muted);font-size:.9rem;margin-top:6px;">Le email automatiche del sito in un unico posto: certificati con un nome non riconosciuto da gestire, e lo storico di tutte le notifiche mandate.</p></div>' +
      '<div class="qcard-link">Apri le segnalazioni ' + ICONS.arrowRight + '</div>' +
    '</div>';
}

// Pagina "Segnalazioni" (solo Admin): due parti.
// - "Da gestire": chi ha caricato un certificato scrivendo un nome
//   che non corrisponde a nessun giocatore. Da qui si vede la foto e
//   si può collegare la segnalazione a un giocatore vero (diventa un
//   certificato vero e proprio, da approvare come al solito) oppure
//   scartarla.
// - "Storico": tutte le email mandate finora dal sito (segnalazioni,
//   gestite o no, e le notifiche ai giocatori), solo per controllare
//   che tutto funzioni.
function viewCertificatoSegnalazioni() {
  if (segnalazioniCache === null) { fetchSegnalazioni(); }

  var inAttesa = (segnalazioniCache && segnalazioniCache.length)
    ? segnalazioniCache.filter(function (s) { return s.stato === 'in_attesa'; })
    : [];

  var tabsHtml = '' +
    '<div style="display:flex;gap:10px;margin:22px 0 4px;">' +
      '<span class="badge ' + (segnalazioniTab === 'gestire' ? 'badge-ok' : 'badge-none') + '" style="cursor:pointer;" onclick="cambiaTabSegnalazioni(\'gestire\')">Da gestire' + (inAttesa.length ? ' (' + inAttesa.length + ')' : '') + '</span>' +
      '<span class="badge ' + (segnalazioniTab === 'storico' ? 'badge-ok' : 'badge-none') + '" style="cursor:pointer;" onclick="cambiaTabSegnalazioni(\'storico\')">Storico</span>' +
    '</div>';

  var body = segnalazioniTab === 'storico' ? corpoStoricoSegnalazioni() : corpoSegnalazioniDaGestire(inAttesa);

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'certificati\')">' + ICONS.arrowLeft + ' Torna a Certificati medici</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Certificati medici</span><h1 style="font-size:2rem;">Segnalazioni</h1>' +
    '<p class="subtitle">Le email che il sito manda in automatico, tutte da qui: le segnalazioni da valutare e lo storico di quelle già mandate.</p></div>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + tabsHtml + body + '</section>';
}

function corpoSegnalazioniDaGestire(inAttesa) {
  if (segnalazioniCache === null || segnalazioniCache === 'loading') {
    return '<p style="color:var(--ink-muted);margin-top:20px;">Caricamento segnalazioni&hellip;</p>';
  }
  if (segnalazioniCache.error) {
    return '<div class="qcard" style="margin-top:20px;"><span><strong>&#9888;&#65039; Segnalazioni non disponibili.</strong> Non &egrave; stato possibile leggerle dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  }
  if (!inAttesa.length) {
    return '<div class="qcard" style="margin-top:20px;">Nessuna segnalazione da gestire al momento.</div>';
  }

  var righe = inAttesa.map(function (s) {
    var aperta = segnalazioneApertaId === s.id;
    var riga = '' +
      '<div class="qcard cert-row cert-row-clickable" style="flex-direction:row;" onclick="apriSegnalazione(' + s.id + ')">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.cognome) + ' ' + escapeHtml(s.nome) + '</div>' +
        '<div style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;">Nome non riconosciuto &middot; segnalato il ' + formattaData(s.creato_il) + '</div>' +
        '<div class="right-cluster">' +
          '<span class="status-dot status-dot-warn" title="Da gestire"></span>' +
          ICONS.chevron +
        '</div>' +
      '</div>';

    if (aperta) riga += dettaglioSegnalazioneHtml(s);
    return riga;
  }).join('');

  return '<div class="list" style="margin-top:20px;">' + righe + '</div>';
}

function dettaglioSegnalazioneHtml(s) {

  if (segnalazioneFotoLoading) {
    fotoHtml = '<div class="doc-preview">' + ICONS.docBig + '<span style="font-size:.85rem;">Caricamento foto&hellip;</span></div>';

  } else if (segnalazioneFotoUrl) {

  } else {

      return '<option value="' + g.id + '"' + selected + '>' + escapeHtml(g.cognome) + ' ' + escapeHtml(g.nome) + ' &middot; ' + escapeHtml(g.squadra) + '</option>';

    '<div style="margin-top:6px;">' +
      '<span class="field-label">Collega a un giocatore</span>' +

      '<p style="color:var(--ink-muted);font-size:.78rem;margin-top:6px;">Se il nome scritto corrisponde davvero a un giocatore, magari scritto in modo diverso o con un errore, scelga qui quello giusto: il certificato verr&agrave; caricato per lui, in attesa di approvazione come al solito.</p>' +
    '</div>' +
    (segnalazioneErrore ? '<p style="color:var(--late);font-weight:700;margin-top:6px;">' + escapeHtml(segnalazioneErrore) + '</p>' : '') +

    '</div>' +
    '<div style="text-align:center;margin-top:10px;">' +

    '</div>';

  return '' +
    '<div class="qcard" style="flex-direction:row;align-items:flex-start;gap:16px;flex-wrap:nowrap;overflow-x:auto;margin-top:10px;" onclick="event.stopPropagation();">' +
      '<div style="flex:0 0 160px;width:160px;">' + fotoHtml + '</div>' +
      '<div style="flex:1 1 260px;min-width:260px;display:flex;flex-direction:column;gap:10px;">' + descrizioneHtml + '</div>' +
    '</div>';
}

// Tab "Storico": due elenchi di sola consultazione, uno per le
// segnalazioni (tutte, gestite o no) e uno per le notifiche via email
// ai giocatori (approvato/scartato/in scadenza/scaduto).
function corpoStoricoSegnalazioni() {
  var ricercaAttiva = segnalazioniRicerca.trim() !== '';
  var barraRicercaSegnalazioniHtml = barraRicerca('ricercaSegnalazioniInput', segnalazioniRicerca, 'onRicercaSegnalazioniChange', 'Cerca per nome o cognome&hellip;');

  var seg;
  if (segnalazioniCache === null || segnalazioniCache === 'loading') {
    seg = '<p style="color:var(--ink-muted);">Caricamento&hellip;</p>';
  } else if (segnalazioniCache.error) {
    seg = '<div class="qcard"><span>&#9888;&#65039; Non disponibile: verificare che il server sia avviato.</span></div>';
  } else if (!segnalazioniCache.length) {
    seg = '<div class="qcard">Nessuna segnalazione ricevuta finora.</div>';
  } else {
    // Di norma mostriamo solo le segnalazioni degli ultimi 10 giorni,
    // per non far crescere all'infinito questo elenco: chi cerca un
    // nome con la barra qui sopra, però, vede il risultato tra TUTTE le
    // segnalazioni mai ricevute, anche le più vecchie.
    var elencoVisibile = segnalazioniCache;
    if (ricercaAttiva) {
      var testoRicerca = segnalazioniRicerca.trim().toLowerCase();
      elencoVisibile = elencoVisibile.filter(function (s) {
        return [s.nome, s.cognome].some(function (campo) {
          return campo && String(campo).toLowerCase().indexOf(testoRicerca) !== -1;
        });
      });
    } else {
      var dieciGiorniFa = new Date();
      dieciGiorniFa.setDate(dieciGiorniFa.getDate() - 10);
      elencoVisibile = elencoVisibile.filter(function (s) { return new Date(s.creato_il) >= dieciGiorniFa; });
    }

    if (!elencoVisibile.length) {
      seg = '<div class="qcard">' + (ricercaAttiva ? 'Nessuna segnalazione trovata per questa ricerca.' : 'Nessuna segnalazione negli ultimi 10 giorni: usi la ricerca qui sopra per trovarne una più vecchia.') + '</div>';
    } else {
      seg = '<div class="list">' + elencoVisibile.map(function (s) {
        var statoInfo;
        if (s.stato === 'collegata') statoInfo = { label: 'Collegata', cls: 'badge badge-ok' };
        else if (s.stato === 'scartata') statoInfo = { label: 'Scartata', cls: 'badge badge-none' };
        else statoInfo = { label: 'Da gestire', cls: 'badge badge-pending' };
        return '' +
        '<div class="qcard cert-row" style="flex-direction:row;">' +
          '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(s.cognome) + ' ' + escapeHtml(s.nome) + '</div>' +
          '<div style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;">Segnalato il ' + formattaData(s.creato_il) + '</div>' +
          '<div class="right-cluster"><span class="' + statoInfo.cls + '">' + statoInfo.label + '</span></div>' +
        '</div>';
      }).join('') + '</div>';
    }
  }

  var notif;
  if (notificheStoricoCache === null || notificheStoricoCache === 'loading') {
    notif = '<p style="color:var(--ink-muted);">Caricamento&hellip;</p>';
  } else if (notificheStoricoCache.error) {
    notif = '<div class="qcard"><span>&#9888;&#65039; Non disponibile: verificare che il server sia avviato.</span></div>';
  } else if (!notificheStoricoCache.length) {
    notif = '<div class="qcard">Nessuna notifica mandata finora.</div>';
  } else {
    var etichetteTipo = { approvato: 'Approvato', scartato: 'Scartato', in_scadenza: 'In scadenza', scaduto: 'Scaduto' };

    // Un giocatore compare una volta per ogni email che gli è stata
    // mandata nel tempo: qui teniamo solo la più recente per ciascuno,
    // usando l'email del destinatario per riconoscerlo (più affidabile
    // di nome e cognome, che in teoria potrebbero coincidere tra due
    // persone diverse). L'elenco arriva dal server già ordinato dalla
    // notifica più recente alla più vecchia (vedi GET /api/notifiche),
    // quindi la prima volta che incontriamo un destinatario è già la
    // sua notifica più recente: il risultato resta ordinato allo
    // stesso modo, con il giocatore con l'email più recente per primo.
    var giaVisti = {};
    var unaPerGiocatore = notificheStoricoCache.filter(function (n) {
      var chiave = n.destinatario || ('nome:' + (n.cognome_giocatore || '') + '|' + (n.nome_giocatore || ''));
      if (giaVisti[chiave]) return false;
      giaVisti[chiave] = true;
      return true;
    });

    notif = '<div class="list">' + unaPerGiocatore.map(function (n) {
      var nomeCompleto = (n.nome_giocatore || n.cognome_giocatore) ? (escapeHtml(n.cognome_giocatore || '') + ' ' + escapeHtml(n.nome_giocatore || '')) : 'Giocatore';
      return '' +
      '<div class="qcard cert-row" style="flex-direction:row;">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + nomeCompleto + '</div>' +
        '<div style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;">' + formattaData(n.data_invio) + (n.destinatario ? ' &middot; a ' + escapeHtml(n.destinatario) : '') + '</div>' +
        '<div class="right-cluster"><span class="badge badge-none">' + (etichetteTipo[n.tipo] || n.tipo || '') + '</span></div>' +
      '</div>';
    }).join('') + '</div>';
  }

  return '' +
    '<h3 style="font-size:.85rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;">Segnalazioni ricevute</h3>' +
    barraRicercaSegnalazioniHtml +
    seg +
    '<h3 style="font-size:.85rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:30px 0 10px;">Notifiche mandate ai giocatori</h3>' +
    notif;
}

function onCaricaNomeChange(e) { caricaNomeDigitato = e.target.value; }
function onCaricaCognomeChange(e) { caricaCognomeDigitato = e.target.value; }

function onCaricaFileChange(e) {
  var file = e.target.files[0] || null;
  var errore = erroreFotoCertificato(file);
  if (errore) {
    caricaFile = null;
    caricaEsito = 'errore';
    caricaErroreMessaggio = errore;
    e.target.value = ''; // così si può subito riprovare a scegliere un altro file, anche con lo stesso nome
    render();
    return;
  }
  caricaFile = file;
  caricaEsito = null;
  caricaErroreMessaggio = null;
  render();
}

// Il campo "Data di rilascio" è un normale campo di testo (non il
// datepicker nativo del browser): scrivendo solo cifre, il sito
// aggiunge da solo le "/" mentre si scrive, in formato GG/MM/AAAA.
// Il motivo: nel datepicker nativo, cancellando con "elimina" ci si
// blocca sulle "/" invece di continuare a cancellare le cifre prima
// (per esempio, da mm si resta bloccati lì invece di poter cancellare
// anche gg). Trattandolo come un unico blocco di testo, "elimina"
// funziona in modo normale, senza blocchi a metà.
// Ripulisce quello che è stato scritto tenendo solo cifre e barre "/",
// e scarta le cifre che renderebbero il giorno o il mese impossibili
// (niente giorno oltre 31, niente mese oltre 12). Un giorno o un mese
// scritto con una sola cifra viene completato da solo con lo zero
// davanti in due casi:
//  - se quella cifra non può comunque diventare a due cifre (giorno
//    4-9, mese 2-9: per esempio scrivendo "9" per il 9 settembre non
//    esiste nessun giorno a due cifre che comincia per 9);
//  - se dopo quella cifra si scrive proprio "/" (esattamente come si
//    scriverebbe la data a mano, tipo "3/1/2026"): la "/" conferma che
//    quella cifra da sola è tutto il giorno (o il mese), anche se in
//    teoria avrebbe potuto diventare un numero a due cifre (come 31).
// Altrimenti (cifre 0, 1, 2 o 3 come inizio del giorno, o 0 e 1 come
// inizio del mese, senza una "/" subito dopo) si aspetta ancora una
// seconda cifra, perché potrebbe diventare un numero a due cifre.
function soliDigitiData(testo) {
  var pulito = (testo || '').replace(/[^0-9/]/g, '');
  var i = 0;
  var n = pulito.length;
  var giorno = '';
  var mese = '';
  var anno = '';

  if (i < n && pulito.charAt(i) !== '/') {
    var g1 = pulito.charAt(i);
    if (/[4-9]/.test(g1)) {
      giorno = '0' + g1;
      i++;
    } else {
      giorno = g1;
      i++;
      if (i < n && pulito.charAt(i) === '/') {
        giorno = '0' + giorno; // confermato con la barra scritta a mano
        i++;
      } else if (i < n) {
        var provaGiorno = giorno + pulito.charAt(i);
        var valoreGiorno = parseInt(provaGiorno, 10);
        if (valoreGiorno >= 1 && valoreGiorno <= 31) {
          giorno = provaGiorno;
          i++;
        } else {
          giorno = '0' + giorno;
        }
      }
    }
  } else if (i < n) {
    i++; // una "/" scritta prima di qualsiasi cifra: la ignoriamo
  }

  while (giorno.length === 2 && i < n && pulito.charAt(i) === '/') i++;

  if (giorno.length === 2 && i < n) {
    var m1 = pulito.charAt(i);
    if (/[2-9]/.test(m1)) {
      mese = '0' + m1;
      i++;
    } else if (/[01]/.test(m1)) {
      mese = m1;
      i++;
      if (i < n && pulito.charAt(i) === '/') {
        mese = '0' + mese; // confermato con la barra scritta a mano
        i++;
      } else if (i < n) {
        var provaMese = mese + pulito.charAt(i);
        var valoreMese = parseInt(provaMese, 10);
        if (valoreMese >= 1 && valoreMese <= 12) {
          mese = provaMese;
          i++;
        } else {
          mese = '0' + mese;
        }
      }
    }
  }

  while (mese.length === 2 && i < n && pulito.charAt(i) === '/') i++;

  if (mese.length === 2) {
    anno = pulito.slice(i).replace(/\D/g, '').slice(0, 4);
  }

  return giorno + mese + anno;
}

function formattaDigitiComeData(cifre) {
  var risultato = cifre.slice(0, 2);
  if (cifre.length > 2) risultato += '/' + cifre.slice(2, 4);
  if (cifre.length > 4) risultato += '/' + cifre.slice(4, 8);
  return risultato;
}

// Dalle 8 cifre digitate (GGMMAAAA) ricava la data in formato
// "AAAA-MM-GG", oppure null se quelle cifre non formano una data che
// esiste davvero (per esempio 31/02, o 31/04): il numero di giorni di
// ogni mese (compreso l'anno bisestile) lo calcola JavaScript stesso,
// non serve scriverlo a mano.
function dataDigitiInIso(cifre) {
  if (cifre.length !== 8) return null;
  var giorno = parseInt(cifre.slice(0, 2), 10);
  var mese = parseInt(cifre.slice(2, 4), 10);
  var anno = parseInt(cifre.slice(4, 8), 10);
  if (mese < 1 || mese > 12) return null;
  var giorniNelMese = new Date(anno, mese, 0).getDate();
  if (giorno < 1 || giorno > giorniNelMese) return null;
  var mm = mese < 10 ? '0' + mese : '' + mese;
  var gg = giorno < 10 ? '0' + giorno : '' + giorno;
  return anno + '-' + mm + '-' + gg;
}

function onCaricaDataRilascioInputChange(e) {
  var cifre = soliDigitiData(e.target.value);
  var formattato = formattaDigitiComeData(cifre);
  e.target.value = formattato;
  try { e.target.setSelectionRange(formattato.length, formattato.length); } catch (err) {}

  caricaDataRilascioTesto = formattato;
  if (cifre.length === 8) {
    var iso = dataDigitiInIso(cifre);
    caricaDataRilascio = iso;
    caricaDataRilascioErroreLive = iso ? null : 'Questa data non esiste: controlli il giorno e il mese scritti.';
  } else {
    caricaDataRilascio = null;
    caricaDataRilascioErroreLive = null;
  }
}

function onCaricaNotaChange(e) {
  caricaNota = e.target.value;
}

// Trasforma una Date in stringa "AAAA-MM-GG" usando l'ora locale (non
// UTC): serve per calcolare gli estremi della data di rilascio senza
// rischiare che vicino alla mezzanotte la data cambi di un giorno.
function dataLocaleISO(d) {
  var anno = d.getFullYear();
  var mese = String(d.getMonth() + 1).padStart(2, '0');
  var giorno = String(d.getDate()).padStart(2, '0');
  return anno + '-' + mese + '-' + giorno;
}

// Intervallo di date accettabili per la data di rilascio di un
// certificato (vale per tutte le varianti di caricamento: Admin,
// Giocatore riconosciuto, Giocatore non riconosciuto): non può essere
// nel futuro, e non può essere così vecchia che il certificato
// risulterebbe già scaduto oggi (la scadenza si calcola sempre un
// anno esatto dopo la data di rilascio).
function limiteMaxDataRilascio() {
  return dataLocaleISO(new Date());
}
function limiteMinDataRilascio() {
  var d = new Date();
  d.setFullYear(d.getFullYear() - 1);
  return dataLocaleISO(d);
}

// Controlla la data di rilascio scritta nel modulo "Carica
// certificato": restituisce un messaggio di errore se non va bene,
// altrimenti null. È solo un controllo "in anteprima" per non far
// perdere tempo a chi carica (niente attesa della foto e della
// risposta del server): quello che conta davvero lo rifà il server,
// per tutte le varianti di caricamento (vedi POST /api/certificati e
// POST /api/certificati/segnalazione).
function erroreDataRilascio(valore) {
  if (!valore) return null; // campo obbligatorio: controllato a parte
  var d = new Date(valore + 'T00:00:00');
  if (isNaN(d.getTime())) return 'Data di rilascio non valida.';
  var oggi = new Date();
  oggi.setHours(0, 0, 0, 0);
  if (d > oggi) return 'La data di rilascio non può essere nel futuro.';
  var scadenza = new Date(d);
  scadenza.setFullYear(scadenza.getFullYear() + 1);
  if (scadenza < oggi) {
    return 'Con questa data di rilascio il certificato risulterebbe già scaduto dal ' + formattaDataBreve(dataLocaleISO(scadenza)) + ': controlli di aver scritto la data giusta.';
  }
  return null;
}

// Formati e dimensione massima accettati per la foto del certificato:
// le stesse regole valgono lato server (vedi erroreFotoCertificato in
// server.js), qui servono solo per dare subito un messaggio chiaro
// senza dover aspettare l'invio.
var FORMATI_FOTO_ACCETTATI = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
var DIMENSIONE_MASSIMA_FOTO = 5 * 1024 * 1024; // 5 MB
var DIMENSIONE_MASSIMA_FOTO_MB = 5;

function erroreFotoCertificato(file) {
  if (!file) return null; // campo obbligatorio: controllato a parte
  if (FORMATI_FOTO_ACCETTATI.indexOf(file.type) === -1) {
    return 'Formato non accettato: si può caricare solo una foto in JPG, PNG o WEBP, oppure un file PDF.';
  }
  if (file.size > DIMENSIONE_MASSIMA_FOTO) {
    return 'La foto è troppo pesante (' + Math.round(file.size / 1024 / 1024 * 10) / 10 + ' MB): il massimo consentito è ' + DIMENSIONE_MASSIMA_FOTO_MB + ' MB. Provi a scattarne una nuova con una qualità più bassa, oppure a comprimerla.';
  }
  return null;
}

function submitCertificato() {
  var perGiocatore = !!(accesso && accesso.ruolo === 'giocatore');

  if (!(caricaNomeDigitato || '').trim() || !(caricaCognomeDigitato || '').trim() || !caricaFile || !caricaDataRilascio) {
    caricaEsito = 'mancano-dati';
    render();
    return;
  }

  // Controllo sulla data di rilascio prima di leggere la foto e
  // contattare il server: vale per tutte le varianti (Admin,
  // Giocatore riconosciuto, Giocatore non riconosciuto), visto che
  // passano tutte da qui.
  var erroreData = erroreDataRilascio(caricaDataRilascio);
  if (erroreData) {
    caricaEsito = 'errore';
    caricaErroreMessaggio = erroreData;
    render();
    return;
  }

  // Ricontrollo della foto (formato e dimensione): normalmente è già
  // stata controllata al momento della scelta, vedi onCaricaFileChange.
  var erroreFoto = erroreFotoCertificato(caricaFile);
  if (erroreFoto) {
    caricaEsito = 'errore';
    caricaErroreMessaggio = erroreFoto;
    render();
    return;
  }

  caricaInviando = true;
  caricaEsito = null;
  caricaErroreMessaggio = null;
  caricaEsitoNomeGiocatore = null;
  render();

  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1] || '';

    // Per il Giocatore l'id è già certo: è quello del proprio account,
    // deciso dal server (giocatoreIdentitaId), non quello che compare
    // scritto nei campi (che sono comunque bloccati, vedi
    // viewCertificatoCarica). Così non c'è nessun modo, nemmeno
    // forzando i campi, di caricare un certificato a nome di un altro
    // giocatore. Solo per l'Admin, che scrive il nome a mano, cerchiamo
    // qui il giocatore corrispondente: se non lo troviamo, non esiste
    // un giocatore a cui collegarlo, e al posto di /api/certificati
    // chiamiamo /api/certificati/segnalazione, che salva comunque la
    // segnalazione (foto compresa) in Certificati medici > Segnalazioni
    // e avvisa l'Admin, senza salvare nulla come certificato vero.
    var idTrovato = null;
    if (perGiocatore) {
      idTrovato = giocatoreIdentitaId || null;
    } else if (giocatoriCache && giocatoriCache.length) {
      var nomeConfronto = caricaNomeDigitato.trim().toLowerCase();
      var cognomeConfronto = caricaCognomeDigitato.trim().toLowerCase();
      var trovato = giocatoriCache.filter(function (g) {
        return (g.nome || '').trim().toLowerCase() === nomeConfronto && (g.cognome || '').trim().toLowerCase() === cognomeConfronto;
      })[0] || null;
      if (trovato) idTrovato = trovato.id;
    }

    // Nome del giocatore a cui verrà collegato il certificato (se
    // trovato, preso da giocatoriCache per avere maiuscole/minuscole
    // giuste anche se scritto tutto minuscolo): serve solo per
    // personalizzare il messaggio di successo, in particolare per
    // l'Admin (vedi caricaEsitoNomeGiocatore in viewCertificatoCarica).
    var nomeGiocatoreCaricato = null;
    if (idTrovato && giocatoriCache && giocatoriCache.length) {
      var giocatoreTrovatoPerNome = giocatoriCache.filter(function (g) { return String(g.id) === String(idTrovato); })[0];
      if (giocatoreTrovatoPerNome) nomeGiocatoreCaricato = giocatoreTrovatoPerNome.cognome + ' ' + giocatoreTrovatoPerNome.nome;
    }

    var richiesta;
    if (!idTrovato) {
      richiesta = fetch('/api/certificati/segnalazione', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome: caricaNomeDigitato.trim(),
          cognome: caricaCognomeDigitato.trim(),
          foto_base64: base64,
          foto_mime: caricaFile.type,
          data_rilascio: caricaDataRilascio,
          nota: caricaNota,
        }),
      });
    } else {
      richiesta = fetch('/api/certificati', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id_giocatore: idTrovato,
          foto_base64: base64,
          foto_mime: caricaFile.type,
          data_rilascio: caricaDataRilascio,
          nota: caricaNota,
        }),
      });
    }

    richiesta
      .then(function (res) {
        return res.json().then(function (corpo) {
          if (!res.ok) {
            var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
            errore.messaggioServer = corpo && corpo.errore;
            throw errore;
          }
          return corpo;
        });
      })
      .then(function () {
        caricaInviando = false;
        if (!idTrovato) {
          caricaEsito = 'segnalato';
        } else {
          caricaEsito = 'ok';
          caricaEsitoNomeGiocatore = nomeGiocatoreCaricato;
          if (perGiocatore) {
            // Lo ricordiamo anche per le altre pagine (Certificati,
            // Archivio…), come subito dopo l'accesso: vedi
            // giocatoreIdentitaId. Solo per chi è entrato come
            // Giocatore: per l'Admin non avrebbe senso.
            giocatoreIdentitaId = idTrovato;
            try { localStorage.setItem('giocatoreIdentitaId', giocatoreIdentitaId); } catch (e) {}
          }
        }
        caricaFile = null;
        caricaDataRilascio = null;
        caricaDataRilascioTesto = '';
        caricaDataRilascioErroreLive = null;
        caricaNota = '';
        certificatiCache = null; // così l'elenco in Gestione si aggiorna alla prossima visita
        archivioCache = null;
        render();
      })
      .catch(function (errore) {
        caricaInviando = false;
        caricaEsito = 'errore';
        caricaErroreMessaggio = (errore && errore.messaggioServer) || null;
        render();
      });
  };
  reader.readAsDataURL(caricaFile);
}

function viewCertificatoCarica() {
  if (giocatoriCache === null) { fetchGiocatori(); }

  var perGiocatore = !!(accesso && accesso.ruolo === 'giocatore');

  // Per il Giocatore, nome e cognome sono sempre e solo i suoi, presi
  // dal database: non può scriverli né cambiarli, così non ha nessuna
  // possibilità di caricare un certificato a nome di un altro
  // giocatore. Aspettiamo che l'elenco dei giocatori sia stato
  // caricato per essere sicuri di mostrare il nome giusto; se il Suo

      corpoBloccante = '<div class="qcard"><span><strong>&#9888;&#65039; Non disponibile.</strong> Non &egrave; stato possibile leggere i dati dal server: verificare che il server sia avviato e collegato al database.</span></div>';
    } else {
      mioGiocatorePerCarica = giocatoreLoggato();
      if (!mioGiocatorePerCarica) {

  // &gt; Segnalazioni, da collegare al giocatore giusto (magari il nome

        '<div><span class="field-label">Nome</span><input type="text" value="' + escapeHtml(caricaNomeDigitato) + '" readonly style="' + campoStileCaricaBloccato + '"></div>' +
        '<div><span class="field-label">Cognome</span><input type="text" value="' + escapeHtml(caricaCognomeDigitato) + '" readonly style="' + campoStileCaricaBloccato + '"></div>' +
      '</div>' +

  } else {
    pickerHtml = '' +
      '<span class="field-label">Nome del giocatore</span>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">' +
        '<div><span class="field-label">Nome</span><input type="text" value="' + escapeHtml(caricaNomeDigitato) + '" oninput="onCaricaNomeChange(event)" style="' + campoStileCarica + '"></div>' +
        '<div><span class="field-label">Cognome</span><input type="text" value="' + escapeHtml(caricaCognomeDigitato) + '" oninput="onCaricaCognomeChange(event)" style="' + campoStileCarica + '"></div>' +
      '</div>' +
      '<p style="color:var(--ink-muted);font-size:.8rem;margin:4px 0 0;">Se il nome corrisponde a un giocatore della societ&agrave; il certificato viene collegato a lui in automatico; altrimenti resta come segnalazione da gestire a mano, in Certificati medici &gt; Segnalazioni.</p>';
  }

  var fileLabel = caricaFile ? escapeHtml(caricaFile.name) : 'Trascina qui la foto oppure scegli un file';

  var esitoHtml = '';
  if (caricaEsito === 'ok') {
    esitoHtml = perGiocatore
      ? '<p style="color:var(--ok);font-weight:700;margin-top:14px;">Certificato caricato correttamente: &egrave; in attesa di essere valutato dall\'Admin.</p>'
      : '<p style="color:var(--ok);font-weight:700;margin-top:14px;">Certificato caricato correttamente' + (caricaEsitoNomeGiocatore ? ' per ' + escapeHtml(caricaEsitoNomeGiocatore) : '') + ': lo trova nella pagina Gestione, pronto per essere approvato o scartato.</p>';
  }
  if (caricaEsito === 'segnalato') {

      ? '<p style="color:var(--warn);font-weight:700;margin-top:14px;">Non abbiamo trovato nessun giocatore con questo nome: il certificato non &egrave; stato salvato, ma abbiamo avvisato l\'Admin per farlo verificare.</p>'
      : '<p style="color:var(--warn);font-weight:700;margin-top:14px;">Non abbiamo trovato nessun giocatore con questo nome: il certificato non &egrave; stato salvato. Lo trova nella pagina Segnalazioni: da l&igrave; pu&ograve; collegarlo al giocatore giusto (magari il nome era scritto in modo diverso) oppure scartarlo.</p>';

    (caricaDataRilascioErroreLive ? '<p style="color:var(--late);font-size:.85rem;margin-top:6px;">' + escapeHtml(caricaDataRilascioErroreLive) + '</p>' : '') +

    '<h3 style="font-size:.85rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 4px;">Note (facoltative)</h3>' +
    '<textarea id="caricaNotaInput" onchange="onCaricaNotaChange(event)" placeholder="Scrivi qui eventuali note per chi deve approvare il certificato&hellip;" style="width:100%;min-height:80px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);resize:vertical;">' + escapeHtml(caricaNota) + '</textarea>' +
    '<h3 style="font-size:.85rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 4px;">Foto del certificato</h3>' +
    '<input type="file" id="caricaFileInput" accept="image/jpeg,image/png,image/webp,application/pdf" onchange="onCaricaFileChange(event)" style="display:none">' +
    '<div class="dropzone" onclick="document.getElementById(\'caricaFileInput\').click()">' + ICONS.upload + '<span>' + fileLabel + '</span></div>' +
    '<p style="color:var(--ink-muted);font-size:.8rem;margin-top:6px;">Formati accettati: JPG, PNG, WEBP o PDF (una normale foto scattata col telefono va benissimo). Dimensione massima: ' + DIMENSIONE_MASSIMA_FOTO_MB + ' MB.</p>' +
    esitoHtml +
    '<div class="btn-full" onclick="submitCertificato()">' + (caricaInviando ? 'Invio in corso&hellip;' : 'Invia certificato') + '</div>';

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'certificati\')">' + ICONS.arrowLeft + ' Torna a Certificati medici</div>' +
  '</section>' +
  '<section class="wrap">' +
    '<span class="eyebrow-pill">Certificati medici</span>' +

      (perGiocatore ? 'Carichi la foto del Suo certificato medico.' : 'Scriva il nome del giocatore e carichi la foto del suo certificato medico.') +
    '</p>' +

    '<div class="qcard">' +
      pickerHtml +
