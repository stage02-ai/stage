<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Nome società]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// Applica subito il tema scelto (Impostazioni), prima ancora che la
// pagina si veda, così non si vede per un istante il tema sbagliato e
// poi quello giusto. Solo due temi possibili: chiaro (predefinito) o
// scuro.
(function () {
  try {
    var t = localStorage.getItem('temaSito');
    document.documentElement.setAttribute('data-theme', t === 'scuro' ? 'dark' : 'light');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F2F2F2; --border:#E7E7E7;
  --ink:#131313; --ink-muted:#6E6E6E; --ink-soft:#ABABAB;
  --ok:#4CAF6D; --warn:#E2A73B; --late:#D9534F;
  /* Colori dei pulsanti "pieni" (sfondo scuro, scritta chiara in tema
     chiaro): NON usano --ink direttamente, perché --ink si inverte col
     tema (scuro su sfondo chiaro, chiaro su sfondo scuro) e altrimenti,
     in tema scuro, il pulsante diventerebbe chiaro ma la scritta
     resterebbe bianca, illeggibile. Questi due restano sempre la
     coppia giusta, sfondo scuro/scritta chiara oppure il contrario. */
  --solid-bg:#131313; --solid-text:#FFFFFF;
}
/* Tema scuro: si applica solo quando è stato scelto "Scuro" a mano
   dalla pagina Impostazioni. */
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1E1E1E; --surface-2:#262626; --border:#333333;
  --ink:#F2F2F2; --ink-muted:#ABABAB; --ink-soft:#7A7A7A;
  --solid-bg:#F2F2F2; --solid-text:#131313;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;}
p{line-height:1.6;margin:0;}
a{color:var(--ink);text-decoration:none;}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px;}

.pill{border-radius:999px;border:1.5px solid var(--ink);padding:11px 20px;font-size:.86rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);white-space:nowrap;}
.pill-solid{background:var(--solid-bg);color:var(--solid-text);border-color:var(--solid-bg);}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);flex-shrink:0;cursor:pointer;}

.navbar{background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20;}
.navbar-inner{max-width:1240px;margin:0 auto;padding:16px 40px;display:flex;align-items:center;gap:32px;position:relative;}
.nav-right{display:flex;align-items:center;gap:10px;position:relative;margin-left:auto;z-index:5;}

.navtabs{display:flex;align-items:center;gap:32px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);}

.brand{display:flex;align-items:center;cursor:pointer;z-index:2;}
.brand span{color:var(--ink);font-weight:700;font-size:.92rem;letter-spacing:.01em;white-space:nowrap;}
.navtab-link{padding:6px 0;font-size:.86rem;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.navtab-link.active{color:var(--ink);border-bottom-color:var(--ink);}
.navtab-link:hover{color:var(--ink);}

.dropdown{position:absolute;top:52px;right:0;width:250px;background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:8px;display:flex;flex-direction:column;box-shadow:0 12px 28px rgba(0,0,0,.12);z-index:30;}
.dropdown-item{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:10px;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;}
.dropdown-item:hover{background:var(--surface-2);}
.dropdown-item svg{flex-shrink:0;color:var(--ink-muted);}
.dropdown-divider{height:1px;background:var(--border);margin:6px 4px;}
.dropdown-item-muted{color:var(--ink-muted);font-weight:600;}

.eyebrow-pill{background:var(--surface-2);color:var(--ink-muted);font-size:.78rem;font-weight:600;padding:6px 14px;border-radius:999px;display:inline-block;margin-bottom:14px;}
.page-title{padding:48px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.subtitle{color:var(--ink-muted);font-size:.95rem;max-width:520px;margin-top:10px;}

.hero{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:72px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;}
.hero-badge{background:var(--surface-2);color:var(--ink-muted);font-size:.78rem;font-weight:600;padding:7px 16px;border-radius:999px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;}
@media (max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

.qcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;}
.qcard-icon{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.qcard-link{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--ink);margin-top:auto;}
.qcard-clickable{cursor:pointer;}
.qcard-clickable:hover{border-color:var(--ink-soft);}
.qcard-disabled{opacity:.55;}
.field-label{display:block;font-size:.78rem;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.textfield{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;font-size:.92rem;color:var(--ink);line-height:1.65;min-height:130px;}

.link-row{display:flex;align-items:center;gap:8px;color:var(--ink-muted);font-size:.85rem;font-weight:600;margin-top:2px;}

.btn{border-radius:999px;padding:11px 20px;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;}
.btn-outline{background:var(--surface);color:var(--ink);}

.roster{display:flex;flex-direction:column;}
.player-row{display:flex;align-items:center;gap:16px;padding:16px 6px;border-bottom:1px solid var(--border);}
.player-row:last-child{border-bottom:none;}
.avatar-sm{width:44px;height:44px;border-radius:50%;background:var(--surface-2);flex-shrink:0;}
.num-pill{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--ink-muted);flex-shrink:0;}

.field-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid var(--border);}
.field-row:last-child{border-bottom:none;}
.map-box{width:100%;height:220px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);border:1px solid var(--border);}

.identity-box{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);}
.dropzone{margin-top:18px;border:1.5px dashed var(--border);border-radius:18px;padding:38px;text-align:center;color:var(--ink-muted);display:flex;flex-direction:column;align-items:center;gap:10px;}
.btn-full{width:100%;border-radius:999px;padding:14px;font-size:.92rem;font-weight:700;border:none;background:var(--solid-bg);color:var(--solid-text);text-align:center;margin-top:20px;cursor:pointer;}

.legend{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:28px;color:var(--ink-muted);font-size:.82rem;}
.legend-item{display:flex;align-items:center;gap:7px;}
.list{display:flex;flex-direction:column;gap:14px;}
.cert-row{display:flex;align-items:center;gap:16px;}
.cert-row-clickable{cursor:pointer;}
.cert-row-clickable:hover{border-color:var(--ink-soft);}
.thumb{width:52px;height:52px;border-radius:14px;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);}
.badge{font-size:.76rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink-soft);color:var(--ink-muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;}
.badge-pending{border-style:dashed;}
.badge-ok{border-color:var(--ink);color:var(--ink);}
.badge-none{border-style:dashed;color:var(--ink-soft);}
.badge-rejected{color:var(--ink-muted);}
.status-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.status-dot-blank{background:#fff;border:1.5px solid var(--ink-soft);}
.status-dot-ok{background:var(--ok);}
.status-dot-warn{background:var(--warn);}
.status-dot-late{background:var(--late);}
.chevron{color:var(--ink-soft);flex-shrink:0;}
.right-cluster{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0;}

.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--ink-muted);font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:22px;}
.back-link:hover{color:var(--ink);}
.doc-preview{width:100%;max-width:520px;aspect-ratio:4/3;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-soft);margin-top:6px;}
.detail-meta{color:var(--ink-muted);font-size:.9rem;margin-top:14px;}
.detail-actions{display:flex;gap:12px;margin-top:26px;max-width:520px;}
.btn-approve{flex:1;border-radius:999px;padding:14px;font-size:.92rem;font-weight:700;border:none;background:var(--solid-bg);color:var(--solid-text);text-align:center;cursor:pointer;}
.btn-reject{flex:1;border-radius:999px;padding:14px;font-size:.92rem;font-weight:700;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);text-align:center;cursor:pointer;}

.footer{border-top:1px solid var(--border);padding:36px 0;}
.footer-inner{max-width:1240px;margin:0 auto;padding:0 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;color:var(--ink-muted);font-size:.85rem;}

/* Messaggio "toast": un avviso che compare in basso e sparisce da solo
   dopo pochi secondi (per esempio dopo aver aggiunto un giocatore).
   Sta fuori da #app apposta, così non viene cancellato ogni volta che
   render() ridisegna la pagina. */
#toast-container{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:100;pointer-events:none;}
.toast{max-width:calc(100% - 40px);background:var(--solid-bg);color:var(--solid-text);border-radius:14px;padding:14px 22px;font-size:.88rem;font-weight:600;box-shadow:0 12px 28px rgba(0,0,0,.18);opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease;}
.toast-visibile{opacity:1;transform:translateY(0);}
.toast-errore{background:var(--late);color:#fff;}

/* ============================================================
   Versione per telefono: da qui in giù, tutte le regole si
   attivano solo su schermi stretti (max 700px), quindi non
   cambiano nulla su computer/tablet. Il resto del CSS qui sopra
   resta uguale: qui aggiustiamo solo gli spazi troppo larghi per
   un telefono (i margini ai lati, la barra in alto, i titoli) in
   modo che tutto ci stia senza dover scorrere di lato.
   ============================================================ */
body{overflow-x:hidden;} /* non deve mai comparire una barra per scorrere di lato: se capita, è quasi sempre un elemento più largo dello schermo */

@media (max-width:700px){
  .wrap{padding:0 18px;}
  .footer-inner{padding:0 18px;justify-content:center;text-align:center;}

  /* La barra in alto (logo, menu, icona account) su schermi larghi ha
     il menu centrato "a scomparsa" sopra logo/icona: su un telefono non
     c'è spazio per farlo, quindi il menu va a capo su una riga tutta
     sua sotto logo e icona, e diventa scorribile di lato se le voci
     non ci stanno comunque tutte. */
  .navbar-inner{padding:14px 18px;flex-wrap:wrap;row-gap:10px;}
  .brand{order:1;max-width:60%;overflow:hidden;}
  .brand span{overflow:hidden;text-overflow:ellipsis;display:block;}
  .nav-right{order:2;}
  .navtabs{order:3;position:static;left:auto;top:auto;transform:none;width:100%;justify-content:flex-start;gap:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .navtabs::-webkit-scrollbar{display:none;}

  .hero{padding:40px 22px;border-radius:20px;}
  .page-title{padding:32px 0 14px;}
  .wrap h1{font-size:1.5rem !important;}
  .qcard{padding:18px;border-radius:16px;}
  .dropdown{width:min(250px, calc(100vw - 36px));}

  /* Righe con testo che può essere lungo (email, nomi): vanno a capo
     invece di allargare la pagina e obbligare a scorrere di lato. */
  .cert-row,.field-row,.identity-box{flex-wrap:wrap;}

  /* Alcune schede (foto + descrizione di un certificato, il confronto
     "nuovo" contro "attuale") erano state fatte apposta per restare
     sempre affiancate e scorrere di lato se non c'entravano, invece di
     andare una sopra l'altra (per non deformarsi su schermi medi). Su
     un telefono stretto questo nascondeva i pulsanti "Approva",
     "Scarta" e "Collega e carica" oltre il bordo destro dello schermo,
     senza che si capisse che bisognava scorrere per trovarli: qui li
     obblighiamo a impilarsi, uno sopra l'altro, così tutto resta
     visibile dentro la scheda invece di essere tagliato dal bordo. */
  [style*="flex-wrap:nowrap;overflow-x:auto"]{flex-wrap:wrap !important;overflow-x:visible !important;}
  [style*="flex:1 1 260px;min-width:260px"],[style*="flex:0 0 260px;width:260px"]{flex:1 1 100% !important;width:100% !important;min-width:0 !important;}
}

</style>
</head>
<body>

<div id="app"></div>
<div id="toast-container"></div>

<!-- Libreria ufficiale di Supabase per il browser: serve solo per il
     login vero (email e password) e per la pagina "Imposta la tua
     password". Il resto del sito continua a parlare con il nostro
     server (server.js), non direttamente con Supabase. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---------- tema (Impostazioni) ----------
// Solo due temi possibili: "chiaro" (valore di partenza) o "scuro". La
// scelta resta salvata nel browser di chi la fa (non è un'impostazione
// unica per tutto il sito): l'applicazione immediata all'apertura della
// pagina, per evitare un lampo del tema sbagliato, è già fatta dal
// piccolo script in cima alla pagina (dentro <head>).
var tema = (function () {
  try { return localStorage.getItem('temaSito') || 'chiaro'; } catch (e) { return 'chiaro'; }
})();

function applicaTema(t) {
  document.documentElement.setAttribute('data-theme', t === 'scuro' ? 'dark' : 'light');
}

function impostaTema(nuovoTema) {
  tema = nuovoTema;
  try { localStorage.setItem('temaSito', nuovoTema); } catch (e) {}
  applicaTema(nuovoTema);
  render();
}

// ---------- dati di esempio (in memoria, si resettano ricaricando la pagina) ----------

// Squadre e giocatori arrivano davvero dal database (route /api/squadre e
// /api/squadre/:id/giocatori del server): qui teniamo solo una "cache" di
// ciò che è già stato scaricato, così non richiediamo le stesse cose ad
// ogni click. null = non ancora richiesto, 'loading' = richiesta in corso,
// altrimenti l'array (anche vuoto) oppure { error: true } se qualcosa va storto.
var teamsCache = null;
var rosterCache = {}; // id squadra -> risultato (stessa logica di teamsCache)
var selectedTeamName = null; // nome della squadra aperta, salvato al click per mostrarlo subito nella Rosa

// Stato del piccolo modulo per creare una nuova squadra (solo Admin,
// dalla pagina Squadre): si apre e chiude senza cambiare pagina.
var nuovaSquadraAperta = false;
var nuovaSquadraNome = '';
var nuovaSquadraInviando = false;
var nuovaSquadraErrore = null;

function apriNuovaSquadra() {
  nuovaSquadraAperta = true;
  nuovaSquadraNome = '';
  nuovaSquadraErrore = null;
  render();
}

function annullaNuovaSquadra() {
  nuovaSquadraAperta = false;
  nuovaSquadraNome = '';
  nuovaSquadraErrore = null;
  render();
}

function onNuovaSquadraNomeChange(e) {
  nuovaSquadraNome = e.target.value;
}

function submitNuovaSquadra() {
  var nome = (nuovaSquadraNome || '').trim();
  if (!nome) {
    nuovaSquadraErrore = 'Scriva il nome della squadra.';
    render();
    return;
  }

  nuovaSquadraInviando = true;
  nuovaSquadraErrore = null;
  render();

  fetch('/api/squadre', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: nome }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      nuovaSquadraInviando = false;
      nuovaSquadraAperta = false;
      nuovaSquadraNome = '';
      teamsCache = null; // così l'elenco si aggiorna con la nuova squadra
      render();
    })
    .catch(function (errore) {
      nuovaSquadraInviando = false;
      nuovaSquadraErrore = (errore && errore.messaggioServer) || 'Non è stato possibile creare la squadra.';
      render();
    });
}

// Stato per modificare il nome di una squadra esistente (matita sulla
// card): solo una alla volta, come il modulo di creazione qui sopra.
var squadraInModificaId = null;
var squadraModificaNome = '';
var squadraModificaInviando = false;
var squadraModificaErrore = null;

function apriModificaSquadra(id) {
  // Prendo il nome attuale da teamsCache (già in memoria) invece di
  // passarlo nell'onclick: un nome con apostrofi o virgolette avrebbe
  // rotto l'attributo HTML del pulsante.
  var t = (teamsCache && teamsCache.length)
    ? teamsCache.filter(function (x) { return String(x.id) === String(id); })[0]
    : null;
  if (!t) { return; }

  squadraInModificaId = t.id;
  squadraModificaNome = t.nome;
  squadraModificaErrore = null;
  squadraDaEliminareId = null; // chiudo un'eventuale conferma di eliminazione aperta su un'altra card
  render();
}

function annullaModificaSquadra() {
  squadraInModificaId = null;
  squadraModificaNome = '';
  squadraModificaErrore = null;
  render();
}

function onSquadraModificaNomeChange(e) {
  squadraModificaNome = e.target.value;
}

function submitModificaSquadra(id) {
  var nome = (squadraModificaNome || '').trim();
  if (!nome) {
    squadraModificaErrore = 'Scriva il nome della squadra.';
    render();
    return;
  }

  squadraModificaInviando = true;
  squadraModificaErrore = null;
  render();

  fetch('/api/squadre/' + encodeURIComponent(id), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: nome }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      squadraModificaInviando = false;
      squadraInModificaId = null;
      squadraModificaNome = '';
      teamsCache = null; // così l'elenco mostra subito il nome nuovo
      render();
    })
    .catch(function (errore) {
      squadraModificaInviando = false;
      squadraModificaErrore = (errore && errore.messaggioServer) || 'Non è stato possibile salvare il nome.';
      render();
    });
}

// Stato per eliminare una squadra (cestino sulla card): chiede prima
// conferma sulla card stessa, senza finestre di dialogo del browser.
var squadraDaEliminareId = null;
var squadraEliminazioneInviando = false;
var squadraEliminazioneErrore = null;

function chiediEliminaSquadra(id) {
  squadraDaEliminareId = id;
  squadraEliminazioneErrore = null;
  squadraInModificaId = null; // chiudo un'eventuale modifica aperta su un'altra card
  render();
}

function annullaEliminaSquadra() {
  squadraDaEliminareId = null;
  squadraEliminazioneErrore = null;
  render();
}

function confermaEliminaSquadra(id) {
  squadraEliminazioneInviando = true;
  squadraEliminazioneErrore = null;
  render();

  fetch('/api/squadre/' + encodeURIComponent(id), { method: 'DELETE' })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      squadraEliminazioneInviando = false;
      squadraDaEliminareId = null;
      teamsCache = null; // così l'elenco non mostra più la squadra eliminata
      render();
    })
    .catch(function (errore) {
      squadraEliminazioneInviando = false;
      squadraEliminazioneErrore = (errore && errore.messaggioServer) || 'Non è stato possibile eliminare la squadra.';
      render();
    });
}

// Stato del modulo per aggiungere un nuovo giocatore (solo Admin,
// dalla pagina Squadre > Giocatori): si apre e chiude senza cambiare
// pagina, come il modulo "Nuova squadra". Il responsabile non si
// sceglie qui: lo assegna da solo il server, in base alla squadra
// scelta (vedi POST /api/giocatori).
var nuovoGiocatoreAperto = false;
var nuovoGiocatoreNome = '';
var nuovoGiocatoreCognome = '';
var nuovoGiocatoreEmail = '';
var nuovoGiocatoreDataNascita = '';
var nuovoGiocatoreDataTesto = ''; // quello che si vede scritto nel campo, in formato GG/MM/AAAA (anche incompleto, mentre si sta ancora scrivendo)
var nuovoGiocatoreSquadreIds = []; // un giocatore può appartenere a più squadre: elenco degli id scelti
var nuovoGiocatoreSquadreAperto = false; // se l'elenco delle caselle è aperto in questo momento
var nuovoGiocatoreInviando = false;
var nuovoGiocatoreErrore = null;

// ---------- "Aggiungi con link WhatsApp" ----------
//
// Modalità alternativa a "Nuovo giocatore" qui sopra, per quando il
// giocatore non è presente di persona: l'Admin inserisce solo nome,
// cognome e squadre; il sito genera un link da mandare al giocatore
// (su WhatsApp, o come preferisce). Aprendo quel link, il giocatore
// stesso sceglie data di nascita, email e password, e si registra da
// solo (vedi viewRegistrazione() più sotto, e POST /api/giocatori/rapido
// sul server).
var giocatoreRapidoAperto = false;
var giocatoreRapidoNome = '';
var giocatoreRapidoCognome = '';
var giocatoreRapidoSquadreIds = [];
var giocatoreRapidoSquadreAperto = false;
var giocatoreRapidoInviando = false;
var giocatoreRapidoErrore = null;
// Compilato dopo una creazione riuscita (o dopo aver generato/rigenerato
// un link per un giocatore già esistente, vedi generaLinkRegistrazione
// più sotto): { nome, cognome, link }, per mostrare il link appena
// pronto con i pulsanti "Copia" e "Apri WhatsApp". Torna a null quando
// si chiude quel riquadro.
var giocatoreRapidoLinkGenerato = null;

function apriGiocatoreRapido() {
  giocatoreRapidoAperto = true;
  giocatoreRapidoNome = '';
  giocatoreRapidoCognome = '';
  giocatoreRapidoSquadreIds = [];
  giocatoreRapidoSquadreAperto = false;
  giocatoreRapidoErrore = null;
  giocatoreRapidoLinkGenerato = null;
  if (teamsCache === null) { fetchTeams(); }
  render();
}
function annullaGiocatoreRapido() {
  giocatoreRapidoAperto = false;
  giocatoreRapidoErrore = null;
  giocatoreRapidoLinkGenerato = null;
  render();
}
function onGiocatoreRapidoNomeChange(e) { giocatoreRapidoNome = e.target.value; }
function onGiocatoreRapidoCognomeChange(e) { giocatoreRapidoCognome = e.target.value; }
function onGiocatoreRapidoSquadraToggle(idSquadra, selezionata) {
  giocatoreRapidoSquadreIds = aggiornaElencoSquadreScelte(giocatoreRapidoSquadreIds, idSquadra, selezionata);
  render();
}
function toggleGiocatoreRapidoSquadreAperto() {
  giocatoreRapidoSquadreAperto = !giocatoreRapidoSquadreAperto;
  render();
}

function submitGiocatoreRapido() {
  var nome = (giocatoreRapidoNome || '').trim();
  var cognome = (giocatoreRapidoCognome || '').trim();
  var idSquadre = giocatoreRapidoSquadreIds || [];

  if (!nome || !cognome || !idSquadre.length) {
    giocatoreRapidoErrore = !idSquadre.length ? 'Scelga almeno una squadra.' : 'Scriva nome e cognome.';
    render();
    return;
  }

  giocatoreRapidoInviando = true;
  giocatoreRapidoErrore = null;
  render();

  fetch('/api/giocatori/rapido', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: nome, cognome: cognome, id_squadre: idSquadre }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function (corpo) {
      giocatoreRapidoInviando = false;
      giocatoriCache = null; // così l'elenco mostra subito il nuovo giocatore
      giocatoreRapidoLinkGenerato = { nome: nome, cognome: cognome, link: corpo.link };
      render();
    })
    .catch(function (errore) {
      giocatoreRapidoInviando = false;
      giocatoreRapidoErrore = (errore && errore.messaggioServer) || 'Non è stato possibile creare il giocatore.';
      render();
    });
}

// Genera (o rigenera) il link di registrazione per un giocatore già
// esistente, creato con "Aggiungi con link WhatsApp", che non si è
// ancora registrato: richiamata dal pulsante sulla sua riga
// nell'elenco Giocatori. Il link precedente (se c'era) smette subito
// di funzionare.
var giocatoreLinkInCorsoId = null;

function generaLinkRegistrazione(id, nome, cognome) {
  if (giocatoreLinkInCorsoId) return; // evita doppi invii mentre uno è già in corso
  giocatoreLinkInCorsoId = id;
  render();

  fetch('/api/giocatori/' + encodeURIComponent(id) + '/link-registrazione', { method: 'POST' })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function (corpo) {
      giocatoreLinkInCorsoId = null;
      giocatoriCache = null; // aggiorna la scadenza mostrata sulla riga
      giocatoreRapidoLinkGenerato = { nome: nome, cognome: cognome, link: corpo.link };
      render();
    })
    .catch(function (errore) {
      giocatoreLinkInCorsoId = null;
      render();
      mostraToast((errore && errore.messaggioServer) || 'Non sono riuscito a generare il link.', 'errore');
    });
}

// Copia negli appunti il link appena generato (pulsante "Copia" nel
// riquadro che compare dopo aver creato un giocatore rapido o generato
// un link): se il browser non lo permette, l'utente può comunque
// selezionare e copiare il testo a mano (resta scritto per intero).
function copiaLinkRegistrazione() {
  if (!giocatoreRapidoLinkGenerato) return;
  var testo = giocatoreRapidoLinkGenerato.link;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(testo).then(function () {
      mostraToast('Link copiato.');
    }).catch(function () {
      mostraToast('Non sono riuscito a copiare il link: lo selezioni e lo copi a mano.', 'errore');
    });
  } else {
    mostraToast('Non sono riuscito a copiare il link: lo selezioni e lo copi a mano.', 'errore');
  }
}

// Id del giocatore per cui è in corso l'invio dell'email di accesso
// (pulsante "Manda accesso" nell'elenco Giocatori): null quando nessun
// invio è in corso. Su richiesta del tutor questa email non parte più
// da sola alla creazione del giocatore, ma solo cliccando questo
// pulsante, così l'Admin la controlla lui (vedi inviaAccessoGiocatore
// più sotto e POST /api/giocatori/:id/invita sul server).
var giocatoreInvitoInCorsoId = null;

// Id della squadra da preselezionare nel modulo "Nuovo giocatore"
// quando lo si apre dal pulsante "Aggiungi giocatore" della pagina
// Rosa di una squadra (vedi apriNuovoGiocatorePerSquadra più sotto).
// Non viene svuotata dal reset che avviene a ogni cambio pagina
// (l'ascoltatore "hashchange" più in basso): serve proprio a
// sopravvivere al passaggio dalla pagina Rosa alla pagina Giocatori,
// per poi essere letta una sola volta e azzerata subito dopo.
var vaiAggiungiGiocatorePerSquadraId = null;

function apriNuovoGiocatore() {
  nuovoGiocatoreAperto = true;
  nuovoGiocatoreNome = '';
  nuovoGiocatoreCognome = '';
  nuovoGiocatoreEmail = '';
  nuovoGiocatoreDataNascita = '';
  nuovoGiocatoreDataTesto = '';
  nuovoGiocatoreSquadreIds = [];
  nuovoGiocatoreSquadreAperto = false;
  nuovoGiocatoreErrore = null;
  if (teamsCache === null) { fetchTeams(); }
  render();
}

// Usata dal pulsante "Aggiungi giocatore" nella pagina Rosa di una
// squadra: porta alla pagina Giocatori con il modulo "Nuovo giocatore"
// già aperto e quella squadra già selezionata nel campo "Squadre",
// così l'Admin non deve ricercarla e selezionarla di nuovo. Il cambio
// pagina svuota da solo tutti i moduli aperti (vedi l'ascoltatore
// "hashchange"): qui ci limitiamo a lasciare detto quale squadra
// preselezionare, e sarà quell'ascoltatore ad aprire davvero il
// modulo una volta arrivati sulla nuova pagina.
function apriNuovoGiocatorePerSquadra(idSquadra) {
  vaiAggiungiGiocatorePerSquadraId = idSquadra;
  navigate('squadre/giocatori');
}

function annullaNuovoGiocatore() {
  nuovoGiocatoreAperto = false;
  nuovoGiocatoreErrore = null;
  render();
}

function onNuovoGiocatoreNomeChange(e) { nuovoGiocatoreNome = e.target.value; }
function onNuovoGiocatoreCognomeChange(e) { nuovoGiocatoreCognome = e.target.value; }
function onNuovoGiocatoreEmailChange(e) { nuovoGiocatoreEmail = e.target.value; }
// Come onCaricaDataRilascioInputChange (usata nel modulo di caricamento
// del certificato): formatta le cifre digitate come GG/MM/AAAA man
// mano che si scrive, e la converte in AAAA-MM-GG solo quando le 8
// cifre formano davvero una data che esiste.
function onNuovoGiocatoreDataInputChange(e) {
  var cifre = soliDigitiData(e.target.value);
  var formattato = formattaDigitiComeData(cifre);
  e.target.value = formattato;
  try { e.target.setSelectionRange(formattato.length, formattato.length); } catch (err) {}

  nuovoGiocatoreDataTesto = formattato;
  nuovoGiocatoreDataNascita = cifre.length === 8 ? dataDigitiInIso(cifre) : null;
}
function onNuovoGiocatoreSquadraToggle(idSquadra, selezionata) {
  nuovoGiocatoreSquadreIds = aggiornaElencoSquadreScelte(nuovoGiocatoreSquadreIds, idSquadra, selezionata);
  render();
}
function toggleNuovoGiocatoreSquadreAperto() {
  nuovoGiocatoreSquadreAperto = !nuovoGiocatoreSquadreAperto;
  render();
}

function submitNuovoGiocatore() {
  var nome = (nuovoGiocatoreNome || '').trim();
  var cognome = (nuovoGiocatoreCognome || '').trim();
  var email = (nuovoGiocatoreEmail || '').trim();
  var dataNascita = nuovoGiocatoreDataNascita || '';
  var idSquadre = nuovoGiocatoreSquadreIds || [];

  if (!nome || !cognome || !email || !dataNascita || !idSquadre.length) {
    nuovoGiocatoreErrore = !idSquadre.length ? 'Scelga almeno una squadra.' : 'Compila tutti i campi.';
    render();
    return;
  }
  if (new Date(dataNascita) > new Date(new Date().toDateString())) {
    nuovoGiocatoreErrore = 'La data di nascita non può essere nel futuro.';
    render();
    return;
  }

  nuovoGiocatoreInviando = true;
  nuovoGiocatoreErrore = null;
  render();

  fetch('/api/giocatori', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nome: nome,
      cognome: cognome,
      email: email,
      data_nascita: dataNascita,
      id_squadre: idSquadre,
    }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function (corpo) {
      nuovoGiocatoreInviando = false;
      nuovoGiocatoreAperto = false;
      giocatoriCache = null; // così l'elenco mostra subito il nuovo giocatore
      render();
      // L'email per impostare la password non parte più da sola: resta
      // da cliccare il pulsante "Manda accesso" sulla sua riga
      // nell'elenco, quando l'Admin decide (vedi inviaAccessoGiocatore).
      mostraToast('Giocatore aggiunto. Per fargli scegliere la password, clicchi "Manda accesso" sulla sua riga quando vuole.');
    })
    .catch(function (errore) {
      nuovoGiocatoreInviando = false;
      nuovoGiocatoreErrore = (errore && errore.messaggioServer) || 'Non è stato possibile salvare il giocatore.';
      render();
    });
}

// Manda (o rimanda) l'email di accesso a un giocatore che non ha
// ancora un account collegato: richiamata dal pulsante "Manda accesso"
// sulla sua riga nell'elenco Giocatori (vedi viewSquadreGiocatori).
// Prima questo invio partiva da solo alla creazione del giocatore; su
// richiesta del tutor ora è un'azione separata, controllata
// dall'Admin.
function inviaAccessoGiocatore(id) {
  if (giocatoreInvitoInCorsoId) return; // evita doppi invii mentre uno è già in corso
  giocatoreInvitoInCorsoId = id;
  render();

  fetch('/api/giocatori/' + encodeURIComponent(id) + '/invita', { method: 'POST' })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      giocatoreInvitoInCorsoId = null;
      giocatoriCache = null; // così la riga smette subito di mostrare il pulsante
      render();
      mostraToast('Email di accesso inviata al giocatore.');
    })
    .catch(function (errore) {
      giocatoreInvitoInCorsoId = null;
      render();
      mostraToast((errore && errore.messaggioServer) || 'Non sono riuscito a mandare l\'email di accesso.', 'errore');
    });
}

// Un giocatore può appartenere a più squadre insieme: queste due
// funzioni sono condivise dai moduli "Nuovo giocatore", "Modifica
// giocatore" e "Ripristina giocatore" per gestire l'elenco di caselle
// (una per squadra) invece di un menu a tendina a scelta singola.

// Aggiunge o toglie un id dall'elenco di quelli scelti, a seconda che
// la casella sia stata spuntata o tolta.
function aggiornaElencoSquadreScelte(elencoAttuale, idSquadra, selezionata) {
  var elenco = (elencoAttuale || []).filter(function (id) { return String(id) !== String(idSquadra); });
  if (selezionata) { elenco.push(idSquadra); }
  return elenco;
}

// Disegna il campo "Squadre": un riquadro compatto, delle stesse
// dimensioni di un menu a tendina normale, con scritti i nomi
// già scelti. Premendolo si apre GALLEGGIANDO sopra il resto del
// modulo (non spinge giù gli altri campi, come farebbe un blocco
// normale) l'elenco di caselle da spuntare o togliere.
// "nomeFunzioneAperturaToggle" apre/chiude l'elenco, "aperto" dice se
// è aperto in questo momento, "nomeFunzioneCasella" è la funzione da
// chiamare quando si spunta o si toglie una casella (diversa per ogni
// modulo, così ognuno aggiorna il proprio elenco).
function squadreSelettoreHtml(idsScelti, nomeFunzioneAperturaToggle, aperto, nomeFunzioneCasella) {
  var nomiScelti = (teamsCache || [])
    .filter(function (t) { return (idsScelti || []).some(function (id) { return String(id) === String(t.id); }); })
    .map(function (t) { return t.nome; });
  var etichetta = nomiScelti.length ? nomiScelti.join(', ') : 'Seleziona squadra';

  var elencoHtml = '';
  if (aperto) {
    if (!teamsCache || !teamsCache.length) {
      elencoHtml = '<p style="color:var(--ink-muted);font-size:.82rem;margin:0;padding:10px 4px;">Nessuna squadra disponibile: ne crei prima una dalla pagina Squadre.</p>';
    } else {
      elencoHtml = teamsCache.map(function (t) {
        var selezionata = (idsScelti || []).some(function (id) { return String(id) === String(t.id); });
        return '' +
          '<label class="dropdown-item" style="cursor:pointer;font-weight:600;">' +
            '<input type="checkbox"' + (selezionata ? ' checked' : '') + ' onchange="' + nomeFunzioneCasella + '(' + JSON.stringify(t.id) + ', this.checked)" style="flex-shrink:0;">' +
            '<span style="overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(t.nome) + '</span>' +
          '</label>';
      }).join('');
    }
  }

  return '' +
  '<div style="position:relative;">' +
    '<div onclick="' + nomeFunzioneAperturaToggle + '()" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(etichetta) + '</span>' +
      ICONS.chevron +
    '</div>' +
    (aperto ? '<div class="dropdown" style="left:0;right:0;width:auto;top:calc(100% + 6px);max-height:240px;overflow-y:auto;">' + elencoHtml + '</div>' : '') +
  '</div>';
}

// Disegna un campo a scelta singola con lo stesso stile del campo
// "Squadre" qui sopra: un riquadro compatto che, premuto, apre
// GALLEGGIANDO l'elenco delle opzioni tra cui scegliere, invece del
// solito menu a tendina del browser. Scegliendo un'opzione l'elenco si
// chiude da solo. "opzioni" è un elenco di { valore, etichetta }. Non
// più usata da nessun modulo al momento (Ruolo e Piede preferito sono
// stati tolti), lasciata qui perché generica e riutilizzabile.
function sceltaSingolaSelettoreHtml(valoreScelto, opzioni, placeholder, nomeFunzioneAperturaToggle, aperto, nomeFunzioneScelta) {
  var scelta = (opzioni || []).filter(function (o) { return o.valore === valoreScelto; })[0];
  var etichetta = scelta ? scelta.etichetta : placeholder;

  var elencoHtml = '';
  if (aperto) {
    elencoHtml = (opzioni || []).map(function (o) {
      return '<div class="dropdown-item" onclick=\'' + nomeFunzioneScelta + '(' + JSON.stringify(o.valore) + ')\'>' +
        escapeHtml(o.etichetta) +
      '</div>';
    }).join('');
  }

  return '' +
  '<div style="position:relative;">' +
    '<div onclick="' + nomeFunzioneAperturaToggle + '()" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(etichetta) + '</span>' +
      ICONS.chevron +
    '</div>' +
    (aperto ? '<div class="dropdown" style="left:0;right:0;width:auto;top:calc(100% + 6px);max-height:240px;overflow-y:auto;">' + elencoHtml + '</div>' : '') +
  '</div>';
}

// Il modulo per aggiungere un giocatore con tutti i dati: dati

// Il modulo "Aggiungi con link WhatsApp": solo nome, cognome e
// squadre. Dopo il salvataggio, al posto del modulo compare il link
// appena generato (vedi linkRegistrazioneGeneratoCardHtml più sotto).
function giocatoreRapidoCardHtml() {
  if (giocatoreRapidoLinkGenerato) {
    return linkRegistrazioneGeneratoCardHtml(giocatoreRapidoLinkGenerato, annullaGiocatoreRapido);
  }

  var campoStile = 'width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-size:.92rem;font-family:inherit;background:var(--surface);color:var(--ink);';

// Stato per modificare un giocatore esistente (matita sulla riga,
// pagina Squadre > Giocatori): stesso modulo di "Nuovo giocatore", ma
// precompilato con i dati già salvati. Solo un giocatore alla volta.
var giocatoreInModificaId = null;
var giocatoreModificaNome = '';
var giocatoreModificaCognome = '';
var giocatoreModificaEmail = '';
var giocatoreModificaDataNascita = '';
var giocatoreModificaDataTesto = ''; // quello che si vede scritto nel campo, in formato GG/MM/AAAA (condiviso con Ripristina)
var giocatoreModificaSquadreIds = []; // un giocatore può appartenere a più squadre: elenco degli id scelti
var giocatoreModificaSquadreAperto = false; // se l'elenco delle caselle è aperto in questo momento (condiviso con Ripristina, come il resto di questi campi)
var giocatoreModificaInviando = false;
var giocatoreModificaErrore = null;

function apriModificaGiocatore(id) {
  // Prendo i dati del giocatore già in memoria (giocatoriCache), invece
  // di passarli nell'onclick: così non c'è nessun testo libero (nome,
  // email...) da dover incastrare dentro l'attributo HTML del pulsante,
  // che potrebbe contenere apostrofi o virgolette e romperlo.
  var p = (giocatoriCache && giocatoriCache.length)
    ? giocatoriCache.filter(function (g) { return String(g.id) === String(id); })[0]
    : null;
  if (!p) { return; }

  giocatoreInModificaId = p.id;
  giocatoreModificaNome = p.nome || '';
  giocatoreModificaCognome = p.cognome || '';
  giocatoreModificaEmail = p.email || '';
  giocatoreModificaDataNascita = p.data_nascita || '';
  giocatoreModificaDataTesto = dataIsoInTestoData(p.data_nascita);
  giocatoreModificaSquadreIds = (p.squadre || []).map(function (s) { return s.id; });
  giocatoreModificaSquadreAperto = false;
  giocatoreModificaErrore = null;
  giocatoreDaEliminareId = null; // chiudo un'eventuale conferma di eliminazione aperta su un'altra riga
  if (teamsCache === null) { fetchTeams(); }
  render();
}

var giocatoreDaRipristinareId = null;
var giocatoreRipristinoInviando = false;
var giocatoreRipristinoErrore = null;

function apriRipristinaGiocatore(id) {

    : null;
  if (!p) { return; }

  giocatoreDaRipristinareId = p.id;

  giocatoreModificaDataNascita = p.data_nascita || '';

function submitRipristinoGiocatore(id) {
  var nome = (giocatoreModificaNome || '').trim();
  var cognome = (giocatoreModificaCognome || '').trim();
  var email = (giocatoreModificaEmail || '').trim();
  var dataNascita = giocatoreModificaDataNascita || '';
  var idSquadre = giocatoreModificaSquadreIds || [];

  if (!nome || !cognome || !email || !dataNascita || !idSquadre.length) {
    giocatoreRipristinoErrore = !idSquadre.length ? 'Scelga almeno una squadra.' : 'Compila tutti i campi.';
    render();
    return;
  }
  if (new Date(dataNascita) > new Date(new Date().toDateString())) {
    giocatoreRipristinoErrore = 'La data di nascita non può essere nel futuro.';
    render();
    return;
  }

  giocatoreRipristinoInviando = true;
  giocatoreRipristinoErrore = null;
  render();

  fetch('/api/giocatori/' + encodeURIComponent(id), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      nome: nome,
      cognome: cognome,
      email: email,
      data_nascita: dataNascita,
      id_squadre: idSquadre,
      ripristina: true,
    }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      giocatoreRipristinoInviando = false;
      giocatoreDaRipristinareId = null;
      giocatoriCache = null; // il giocatore ripristinato deve comparire tra gli Attivi
      giocatoriArchiviatiCache = null; // e sparire dagli Archiviati
      certificatiCache = null; // niente più "certificato attuale": dovrà caricarne uno nuovo
      archivioCache = null;
      render();
    })
    .catch(function (errore) {
      giocatoreRipristinoInviando = false;
      giocatoreRipristinoErrore = (errore && errore.messaggioServer) || 'Non è stato possibile ripristinare il giocatore.';
      render();
    });
}

// pagina Gestione.
function confermaCollegaSegnalazione(id) {
  if (!segnalazioneCollegaGiocatoreId) {
    segnalazioneErrore = 'Scegli prima un giocatore da collegare.';
    render();
    return;
  }
  segnalazioneAzioneInCorso = true;
  segnalazioneErrore = null;
  render();

  fetch('/api/segnalazioni/' + encodeURIComponent(id) + '/collega', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id_giocatore: segnalazioneCollegaGiocatoreId }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      segnalazioneAzioneInCorso = false;
      certificatiCache = null; // è comparso un nuovo certificato "in attesa"

      fetchSegnalazioni();

    .catch(function (errore) {
      segnalazioneAzioneInCorso = false;
      segnalazioneErrore = (errore && errore.messaggioServer) || 'Errore durante il collegamento: riprovi.';

function formattaData(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('it-IT') + ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

// Come formattaData ma solo il giorno, senza l'ora: usata per le date
// "civili" come rilascio e scadenza del certificato (non hanno un
// orario associato).
function formattaDataBreve(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('it-IT');
}

// L'operazione opposta di dataDigitiInIso: da una data "AAAA-MM-GG" già
// salvata ricava il testo "GG/MM/AAAA" da mostrare nel campo scrivibile
// (per esempio riaprendo "Modifica giocatore" su un giocatore già
// esistente). Ritorna una stringa vuota se manca la data.
function dataIsoInTestoData(iso) {
  if (!iso) return '';
  var parti = iso.split('-');
  if (parti.length !== 3) return '';
  return parti[2] + '/' + parti[1] + '/' + parti[0];
}

    '</div>';
}

// ---------- accesso (vero login, con Supabase Auth) ----------

// Il login vero (email e password) lo fa direttamente il browser,
// parlando con Supabase Auth tramite questo "client" (creato più in
// basso, appena il sito sa a quale progetto Supabase collegarsi: vedi
// avviaApp()). Il server non vede mai la password: solo il token che
// Supabase restituisce dopo un login riuscito.
var supabaseClient = null;

// Token dell'accesso corrente, da mandare in ogni richiesta al nostro
// server (intestazione "Authorization"): lo tiene aggiornato da solo
// aggiornaAccessoDaSessione() qui sotto, ogni volta che la sessione
// cambia (login, logout, rinnovo automatico del token).
var tokenSessioneCorrente = null;

var accesso = null; // null finché non si è fatto login, altrimenti {ruolo, nome, cognome}

// Diventa true appena sappiamo con certezza se chi ha aperto il sito ha
// già una sessione valida oppure no (vedi aggiornaAccessoDaSessione() più
// sotto): finché resta false, render() mostra un semplice "Caricamento…"
// invece della schermata di accesso. Senza questo accorgimento, chi ha
// già fatto login vedrebbe comunque comparire per un attimo la
// schermata di accesso a ogni apertura/aggiornamento della pagina
// (mentre il sito controlla ancora se la sessione salvata è valida): un
// attimo che, con una connessione lenta, può bastare a dare l'idea di
// essere stati disconnessi.
var accessoControllato = false;

// Stato del modulo di login (email e password).
var loginEmailDigitata = '';
var loginPasswordDigitata = '';
var loginErrore = '';
var loginInCorso = false;

function onLoginEmailChange(e) { loginEmailDigitata = e.target.value; }
function onLoginPasswordChange(e) { loginPasswordDigitata = e.target.value; }

// Richiamata da "Entra" nella schermata di accesso: prova il login
// vero con Supabase Auth. Se le credenziali sono giuste ma l'account
// non è collegato a nessuna persona abilitata sul sito, lo segnaliamo
// e disconnettiamo subito (vedi aggiornaAccessoDaSessione()).
function eseguiLogin() {
  var email = (loginEmailDigitata || '').trim();
  var password = loginPasswordDigitata || '';
  if (!email || !password) {
    loginErrore = 'Scriva email e password.';
    render();
    return;
  }
  if (!supabaseClient) {
    loginErrore = 'Il sito non è ancora pronto per il login: attenda un momento e riprovi.';
    render();
    return;
  }

  loginErrore = '';
  loginInCorso = true;
  render();

  supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function (risultato) {
    loginInCorso = false;
    if (risultato.error) {
      loginErrore = 'Email o password non corretti.';
      render();
      return;
    }
    loginPasswordDigitata = '';
    // Non serve chiamare aggiornaAccessoDaSessione() qui: il login
    // riuscito fa scattare da solo onAuthStateChange (vedi avviaApp()).
  }).catch(function () {
    loginInCorso = false;
    loginErrore = 'Errore imprevisto: riprovare.';
    render();
  });
}

// Richiamata da "Esci" nel menu account.
function esci() {
  menuOpen = false;
  certGiocatoreFotoCertId = null;
  giocatoreIdentitaSelezionataId = null;
  giocatoreIdentitaErrore = '';
  if (supabaseClient) { supabaseClient.auth.signOut(); }
  // accesso, giocatoreIdentitaId e tokenSessioneCorrente vengono
  // azzerati da soli da aggiornaAccessoDaSessione(), richiamata da
  // onAuthStateChange non appena il logout è completato.
}

// ---------- "Password dimenticata?" (nella schermata di accesso) ----------
//
// Chi clicca su "Password dimenticata?" scrive la propria email e
// Supabase Auth gli manda (se l'email corrisponde a un account) un
// link di recupero: cliccandolo arriva sul sito con lo stesso tipo di
// token dell'invito, gestito già da "Imposta la tua password" qui
// sotto (leggiParametriInvito()/impostaPasswordAttiva), quindi non
// serve altro codice per quella parte.
var recuperoPasswordAttivo = false;
var recuperoPasswordEmail = '';
var recuperoPasswordErrore = '';
var recuperoPasswordInCorso = false;
var recuperoPasswordFatto = false;

function onRecuperoPasswordEmailChange(e) { recuperoPasswordEmail = e.target.value; }

// Richiamata da "Password dimenticata?" nella schermata di accesso.
function apriRecuperoPassword() {
  recuperoPasswordAttivo = true;
  recuperoPasswordEmail = loginEmailDigitata || '';
  recuperoPasswordErrore = '';
  recuperoPasswordFatto = false;
  render();
}

// Richiamata da "Annulla"/"Torna all'accesso" nella schermata di
// recupero password: si torna al modulo di login normale.
function annullaRecuperoPassword() {
  recuperoPasswordAttivo = false;
  recuperoPasswordErrore = '';
  recuperoPasswordFatto = false;
  render();
}

function inviaRecuperoPassword() {
  var email = (recuperoPasswordEmail || '').trim();
  if (!email) {
    recuperoPasswordErrore = 'Scriva la Sua email.';
    render();
    return;
  }
  if (!supabaseClient) {
    recuperoPasswordErrore = 'Il sito non è ancora pronto: attenda un momento e riprovi.';
    render();
    return;
  }

  recuperoPasswordErrore = '';
  recuperoPasswordInCorso = true;
  render();

  // Il link nell'email riporta l'utente su questa stessa pagina, con
  // in più il token di recupero: lo stesso meccanismo usato per il
  // link di invito dei nuovi giocatori (vedi leggiParametriInvito()).
  supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + location.pathname,
  }).then(function (risultato) {
    recuperoPasswordInCorso = false;
    if (risultato.error) {
      recuperoPasswordErrore = 'Non sono riuscito a inviare l\'email: ' + risultato.error.message;
      render();
      return;
    }
    // Per motivi di sicurezza Supabase risponde allo stesso modo sia
    // che l'email corrisponda a un account sia che non corrisponda
    // (così chi non ha un account su questo sito non lo scopre da
    // qui): il messaggio mostrato riflette questo.
    recuperoPasswordFatto = true;
    render();
  }).catch(function () {
    recuperoPasswordInCorso = false;
    recuperoPasswordErrore = 'Errore imprevisto: riprovare.';
    render();
  });
}

// ---------- "Imposta la tua password" (dopo l'invito, o dopo aver
// chiesto di recuperarla) ----------
//
// Chi clicca sul link ricevuto via email (invito per un nuovo
// giocatore, oppure recupero password) arriva qui con un token
// speciale nell'indirizzo: lo leggiamo in leggiParametriInvito() e lo
// usiamo solo per lasciargli scegliere una password, prima di
// considerarlo "loggato" a tutti gli effetti.
var impostaPasswordAttiva = false;
var impostaPasswordValore = '';
var impostaPasswordConferma = '';
var impostaPasswordErrore = '';
var impostaPasswordInCorso = false;
var impostaPasswordFatta = false;

// Cambio password dalla pagina Impostazioni (diverso da quello sopra:
// quello serve solo subito dopo aver cliccato il link di invito o di
// recupero password, questo invece è per chi è già dentro al sito e
// vuole semplicemente cambiarla).
var impostazioniPasswordValore = '';
var impostazioniPasswordConferma = '';
var impostazioniPasswordErrore = '';
var impostazioniPasswordInCorso = false;
var impostazioniPasswordFatta = false;

// Modifica di nome, cognome ed email dalla scheda Account di
// Impostazioni. Di norma questi dati si vedono soltanto (di sola
// lettura): "ModificaAttiva" diventa vera solo cliccando la matita,
// mostrando allora i campi da compilare; si torna alla sola lettura
// annullando o dopo un salvataggio riuscito (vedi apriModificaAccount()
// e annullaModificaAccount() più sotto).
var impostazioniAccountModificaAttiva = false;
var impostazioniAccountNome = '';
var impostazioniAccountCognome = '';
var impostazioniAccountEmail = '';
var impostazioniAccountErrore = '';
var impostazioniAccountInCorso = false;
var impostazioniAccountFatta = false;
// Se l'ultimo salvataggio riuscito ha cambiato anche l'email di
// accesso: in quel caso il messaggio di conferma ricorda che serve
// cliccare il link mandato da Supabase prima che il cambio sia attivo.
var impostazioniAccountEmailRichiesta = false;

function leggiParametriInvito() {
  var hash = location.hash || '';
  if (hash.indexOf('access_token=') === -1) return null;
  var parametri = new URLSearchParams(hash.replace(/^#\/?/, ''));
  var accessToken = parametri.get('access_token');
  var refreshToken = parametri.get('refresh_token');
  if (!accessToken || !refreshToken) return null;
  return { accessToken: accessToken, refreshToken: refreshToken };
}

function onImpostaPasswordChange(e) { impostaPasswordValore = e.target.value; }
function onImpostaPasswordConfermaChange(e) { impostaPasswordConferma = e.target.value; }

// ---------- Registrazione di un giocatore da un link WhatsApp ----------
//
// Chi apre un link "#/registrati/TOKEN" (generato dall'Admin con
// "Aggiungi con link WhatsApp", vedi apriGiocatoreRapido() più sopra e
// POST /api/giocatori/rapido sul server) non ha ancora nessun account:
// questa schermata, mostrata al posto del solito login (vedi
// avviaApp() e render() più sotto), gli fa scegliere data di nascita,
// email e password, e completa da sola la registrazione.
var registrazioneAttiva = false;
var registrazioneToken = null;
var registrazioneCaricamento = 'loading'; // 'loading' | 'ok' | 'errore'
var registrazioneErroreCaricamento = '';
var registrazioneNome = '';
var registrazioneCognome = '';
var registrazioneDataTesto = '';
var registrazioneDataNascita = null;
var registrazioneEmail = '';
var registrazionePassword = '';
var registrazionePasswordConferma = '';
var registrazioneErrore = '';
var registrazioneInCorso = false;

// Legge il token dall'indirizzo (es. "#/registrati/AbC123..."): a
// differenza di leggiParametriInvito() qui sopra, il formato del link
// lo decidiamo noi (lo genera il nostro server), non Supabase.
function leggiTokenRegistrazione() {
  var hash = location.hash || '';
  var corrispondenza = hash.match(/^#\/?registrati\/([^/?]+)/);
  return corrispondenza ? decodeURIComponent(corrispondenza[1]) : null;
}

// Chiede al server per chi è il link (nome e cognome) e se è ancora
// valido, prima di mostrare il modulo vero e proprio.
function caricaDatiRegistrazione(token) {
  registrazioneCaricamento = 'loading';
  render();

  fetch('/api/registrazione/' + encodeURIComponent(token))
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function (corpo) {
      registrazioneNome = corpo.nome || '';
      registrazioneCognome = corpo.cognome || '';
      registrazioneCaricamento = 'ok';
      render();
    })
    .catch(function (errore) {
      registrazioneCaricamento = 'errore';
      registrazioneErroreCaricamento = (errore && errore.messaggioServer) || 'Non sono riuscito a leggere questo link: riprovi più tardi.';
      render();
    });
}

function confermaRegistrazione() {
  var dataNascita = registrazioneDataNascita || '';
  var email = (registrazioneEmail || '').trim();
  var password = registrazionePassword || '';
  var passwordConferma = registrazionePasswordConferma || '';

  if (!dataNascita) {
    registrazioneErrore = 'Scriva la Sua data di nascita.';
    render();
    return;
  }
  if (new Date(dataNascita) > new Date(new Date().toDateString())) {
    registrazioneErrore = 'La data di nascita non può essere nel futuro.';
    render();
    return;
  }
  if (!email) {
    registrazioneErrore = 'Scriva la Sua email.';
    render();
    return;
  }
  if (password.length < 8) {
    registrazioneErrore = 'La password deve avere almeno 8 caratteri.';
    render();
    return;
  }
  if (password !== passwordConferma) {
    registrazioneErrore = 'Le due password scritte non coincidono.';
    render();
    return;
  }

  registrazioneErrore = '';
  registrazioneInCorso = true;
  render();

  fetch('/api/registrazione/' + encodeURIComponent(registrazioneToken), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data_nascita: dataNascita, email: email, password: password }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      // Registrazione completata: lo facciamo subito accedere con
      // l'email e la password appena scelte, senza fargli rifare tutto
      // da capo dalla schermata di login.
      return supabaseClient.auth.signInWithPassword({ email: email, password: password });
    })
    .then(function (risultato) {
      if (risultato.error) {
        // Caso raro (per esempio un intoppo di connessione proprio in
        // questo istante): la registrazione è comunque andata a buon
        // fine, quindi lo mandiamo alla schermata di login normale, con
        // le credenziali già pronte per entrare.
        registrazioneAttiva = false;
        accessoControllato = true;
        loginEmailDigitata = email;
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
        mostraToast('Registrazione completata: acceda con l\'email e la password appena scelte.');
        render();
        return;
      }
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
      registrazioneAttiva = false;
      // "SIGNED_IN" esplicito per lo stesso motivo di
      // confermaImpostaPassword() più sopra: avviaApp() è già uscita
      // subito dopo aver letto il token dal link, quindi
      // onAuthStateChange non è collegato per questa sessione. Questo è
      // il primo vero accesso del giocatore: deve partire da
      // "Certificati", come ogni login.
      supabaseClient.auth.getSession().then(function (r) {
        aggiornaAccessoDaSessione(r && r.data ? r.data.session : null, 0, 'SIGNED_IN');
      });
    })
    .catch(function (errore) {
      registrazioneInCorso = false;
      registrazioneErrore = (errore && errore.messaggioServer) || 'Non è stato possibile completare la registrazione: riprovi.';
      render();
    });
}

function confermaImpostaPassword() {
  var pw = impostaPasswordValore || '';
  var pw2 = impostaPasswordConferma || '';
  if (pw.length < 8) {
    impostaPasswordErrore = 'La password deve avere almeno 8 caratteri.';
    render();
    return;
  }
  if (pw !== pw2) {
    impostaPasswordErrore = 'Le due password scritte non coincidono.';
    render();
    return;
  }

  impostaPasswordErrore = '';
  impostaPasswordInCorso = true;
  render();

  supabaseClient.auth.updateUser({ password: pw }).then(function (risultato) {
    impostaPasswordInCorso = false;
    if (risultato.error) {
      impostaPasswordErrore = 'Non sono riuscito a salvare la password: ' + risultato.error.message;
      render();
      return;
    }
    impostaPasswordAttiva = false;
    impostaPasswordFatta = true;
    impostaPasswordValore = '';
    impostaPasswordConferma = '';
    // Recuperiamo la sessione attiva (impostata già da setSession() in
    // avviaApp()) per considerarlo subito "loggato", senza fargli
    // rifare il login con la password appena scelta. "SIGNED_IN" qui è
    // esplicito (non passa da onAuthStateChange, perché avviaApp() è
    // già uscita subito dopo aver letto il token dell'invito): questo
    // è a tutti gli effetti il primo vero accesso del giocatore, quindi
    // deve partire dalla home (o da "Certificati", se è un giocatore),
    // come ogni altro login.
    supabaseClient.auth.getSession().then(function (r) {
      aggiornaAccessoDaSessione(r && r.data ? r.data.session : null, 0, 'SIGNED_IN');
    });
  }).catch(function () {
    impostaPasswordInCorso = false;
    impostaPasswordErrore = 'Errore imprevisto: riprovare.';
    render();
  });
}

// Salva le modifiche a nome, cognome ed email fatte nella scheda
// Account di Impostazioni. Nome e cognome (e l'email scritta sulla
// tabella "persona", usata per esempio per le notifiche sui
// certificati) si aggiornano subito sul server. Se in più è stata
// cambiata anche l'email DI ACCESSO, chiediamo a Supabase Auth di
// cambiarla: quel cambio diventa attivo solo dopo che la persona
// clicca sul link di conferma che le arriva via email, non subito.
function confermaImpostazioniAccount() {
  var nome = (impostazioniAccountNome || '').trim();
  var cognome = (impostazioniAccountCognome || '').trim();
  var email = (impostazioniAccountEmail || '').trim();

  if (!nome) {
    impostazioniAccountErrore = 'Scriva il Suo nome.';
    render();
    return;
  }
  if (!cognome) {
    impostazioniAccountErrore = 'Scriva il Suo cognome.';
    render();
    return;
  }
  if (!email) {
    impostazioniAccountErrore = 'Scriva la Sua email.';
    render();
    return;
  }

  var emailAccessoCambiata = !!(accesso && email !== (accesso.email || ''));

  impostazioniAccountErrore = '';
  impostazioniAccountInCorso = true;
  render();

  fetch('/api/mio-account', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome: nome, cognome: cognome, email: email }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error('errore-account');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      if (!emailAccessoCambiata) return null;
      return supabaseClient.auth.updateUser({ email: email }).then(function (risultato) {
        if (risultato.error) {
          var errore = new Error('errore-email');
          errore.messaggioServer = 'Nome e cognome sono stati salvati, ma non sono riuscito a cambiare l\'email di accesso: ' + risultato.error.message;
          throw errore;
        }
      });
    })
    .then(function () {
      impostazioniAccountInCorso = false;
      impostazioniAccountEmailRichiesta = emailAccessoCambiata;
      if (accesso) {
        accesso.nome = nome;
        accesso.cognome = cognome;
      }
      // I dati di nome/cognome/email compaiono anche nelle liste
      // giocatori e certificati (per l'Admin) e nell'archivio: le
      // ricarichiamo, così mostrano subito i valori aggiornati.
      giocatoriCache = null;
      certificatiCache = null;
      archivioCache = null;
      impostazioniAccountModificaAttiva = false;
      impostazioniAccountFatta = true;
      render();
    })
    .catch(function (errore) {
      impostazioniAccountInCorso = false;
      impostazioniAccountErrore = (errore && errore.messaggioServer) ? errore.messaggioServer : 'Errore durante il salvataggio: riprovi.';
      render();
    });
}

// Chiede a Supabase, per la persona già identificata dal server (vedi
// GET /api/chi-sono), chi è: ruolo, nome, cognome, e se è collegata a
// un giocatore attivo. Viene richiamata ogni volta che la sessione
// cambia (login, logout, rinnovo del token, sessione già presente
// riaprendo il sito): è la sola funzione che decide il valore di
// "accesso".
// Quante volte ritentare "/api/chi-sono" prima di arrenderci, quando il
// problema NON è un rifiuto vero (vedi sotto) ma solo un intoppo di
// connessione (per esempio il server appena "risvegliato" da Vercel
// dopo un po' di inattività, che può metterci un momento in più a
// rispondere la primissima volta).
var TENTATIVI_CHI_SONO = 2;

// "evento" (facoltativo) è il tipo di evento di Supabase Auth che ha
// portato qui (per esempio 'SIGNED_IN', passato da onAuthStateChange
// più sotto, in avviaApp()): serve solo per sapere se si tratta di un
// login VERO E PROPRIO appena fatto (con cui si riparte sempre dalla
// home, invece di ritrovarsi sulla pagina in cui si era rimasti prima
// di disconnettersi), oppure di un semplice ritrovamento di una
// sessione già esistente (riapertura del sito, rinnovo automatico del
// token), che invece non deve spostare nessuno da dove si trova.
function aggiornaAccessoDaSessione(sessione, tentativo, evento) {
  tentativo = tentativo || 0;
  tokenSessioneCorrente = sessione ? sessione.access_token : null;

  if (!sessione) {
    accesso = null;
    giocatoreIdentitaId = null;
    accessoControllato = true;
    render();
    return;
  }

  fetch('/api/chi-sono')
    .then(function (res) {
      if (!res.ok) {
        var erroreHttp = new Error('risposta ' + res.status);
        // Solo 401 ("token non valido o scaduto") e 403 ("account non
        // collegato a nessuna persona abilitata") sono risposte VERE
        // del nostro server su chi è l'account: qualunque altro
        // problema (per esempio 500/502/503, o la richiesta che non
        // arriva affatto) è un intoppo temporaneo, non un giudizio
        // sull'account, e va trattato diversamente qui sotto.
        erroreHttp.rifiutoVero = (res.status === 401 || res.status === 403);
        throw erroreHttp;
      }
      return res.json();
    })
    .then(function (dati) {
      accesso = { ruolo: dati.ruolo, nome: dati.nome, cognome: dati.cognome, email: dati.email };
      giocatoreIdentitaId = dati.idGiocatore || null;
      accessoControllato = true;
      // Su richiesta del tutor, un login VERO (non un semplice
      // ritrovamento di una sessione già esistente) deve sempre far
      // ripartire dalla home, e mai dalla pagina in cui ci si trovava
      // prima di disconnettersi (l'indirizzo, nel frattempo, resta
      // spesso quello: "Esci" non lo svuota da solo).
      if (evento === 'SIGNED_IN') {
        location.hash = (accesso.ruolo === 'giocatore') ? '#/certificati' : '';
      } else if (accesso.ruolo === 'giocatore' && (!location.hash || location.hash === '#')) {
        // Chi riapre il sito con una sessione già valida (non un login
        // vero e proprio) e non ha nessuna pagina specifica nell'indirizzo:
        // per un Giocatore ha comunque senso partire da "Certificati",
        // la sua pagina principale.
        location.hash = '#/certificati';
      }
      render();
    })
    .catch(function (errore) {
      var rifiutoVero = !!(errore && errore.rifiutoVero);

      // Non è un rifiuto vero (è un intoppo di connessione): prima di
      // arrenderci, ritentiamo automaticamente un paio di volte, senza
      // disconnettere nessuno né far comparire nel frattempo la
      // schermata di accesso.
      if (!rifiutoVero && tentativo < TENTATIVI_CHI_SONO) {
        setTimeout(function () {
          aggiornaAccessoDaSessione(sessione, tentativo + 1, evento);
        }, 1200);
        return;
      }

      accessoControllato = true;

      if (rifiutoVero) {
        // L'account ha fatto login su Supabase, ma non è collegato a
        // nessuna persona abilitata (per esempio un account creato per
        // sbaglio, o non ancora collegato), oppure il token non è più
        // valido: qui sì che ha senso disconnettere davvero.
        accesso = null;
        giocatoreIdentitaId = null;
        loginErrore = 'Questo account non è abilitato ad accedere al sito. Contatti l\'Admin.';
        if (supabaseClient) { supabaseClient.auth.signOut(); }
      } else {
        // Il problema di connessione persiste anche dopo aver
        // riprovato: NON disconnettiamo nessuno (la sessione resta
        // valida e salvata come prima), mostriamo solo un avviso.
        // Questo è esattamente il punto che prima causava il problema
        // di "ogni aggiornamento della pagina riporta al login": un
        // singolo intoppo di rete a inizio pagina veniva scambiato per
        // "account non abilitato" e disconnetteva subito, cancellando
        // la sessione salvata; da quel momento in poi ogni successivo
        // aggiornamento della pagina ripartiva senza più nessuna
        // sessione da ritrovare.
        loginErrore = 'Il sito non riesce a collegarsi in questo momento. Riprovi ricaricando la pagina.';
      }
      render();
    });
}

// ---------- identità del Giocatore (chi sono) ----------

// Chi entra come Giocatore viene riconosciuto subito dal server (vedi
// aggiornaAccessoDaSessione() qui sopra), che lo collega al proprio
// account di accesso: non c'è più bisogno di sceglierlo o digitarlo a
// mano. La card "Chi sei?" qui sotto resta solo come recupero, per il
// caso raro di un account Giocatore non ancora collegato a nessun
// giocatore attivo del database (per esempio appena dopo la
// creazione, o se il giocatore collegato è stato nel frattempo
// eliminato): da segnalare all'Admin, se capita.
var giocatoreIdentitaId = null;
var giocatoreIdentitaSelezionataId = null; // scelta nel menu "Chi sei?", prima di confermare
var giocatoreIdentitaErrore = '';

function onIdentitaGiocatoreChange(e) {
  giocatoreIdentitaSelezionataId = e.target.value;
}

function confermaIdentitaGiocatore() {
  if (!giocatoreIdentitaSelezionataId) {
    giocatoreIdentitaErrore = 'Scelga il Suo nome dal menu.';
    render();
    return;
  }
  giocatoreIdentitaId = giocatoreIdentitaSelezionataId;
  giocatoreIdentitaSelezionataId = null;
  giocatoreIdentitaErrore = '';
  try { localStorage.setItem('giocatoreIdentitaId', giocatoreIdentitaId); } catch (e) {}
  render();
}

// Richiamata da "Cambia giocatore" nel menu account: dimentica solo la
// scelta di "chi sono" (resta invece il ruolo Giocatore già scelto).
function cambiaIdentitaGiocatore() {
  giocatoreIdentitaId = null;
  giocatoreIdentitaSelezionataId = null;
  giocatoreIdentitaErrore = '';
  try { localStorage.removeItem('giocatoreIdentitaId'); } catch (e) {}
  menuOpen = false;
  render();
}

// Cerca, dentro l'elenco dei giocatori già caricato dal database, quello
// scelto in giocatoreIdentitaId (vedi sopra). Se chi è entrato come
// Giocatore non ha ancora scelto chi è (o la scelta salvata non
// corrisponde più a nessun giocatore, per esempio perché è stato nel
// frattempo eliminato) restituisce null: i punti in cui viene usata
// questa funzione mostrano in quel caso la card "Chi sei?" per
// sceglierlo.
function giocatoreLoggato() {
  if (!accesso || accesso.ruolo !== 'giocatore') return null;
  if (!giocatoreIdentitaId) return null;
  if (!giocatoriCache || giocatoriCache === 'loading' || giocatoriCache.error || !giocatoriCache.length) return null;
  return giocatoriCache.filter(function (g) { return String(g.id) === String(giocatoreIdentitaId); })[0] || null;
}

// Card "Chi sei?": mostrata al posto delle proprie informazioni ovunque
// serva sapere quale giocatore è, quando ancora non è stato scelto. Con
// "bare" true restituisce solo il contenuto, senza il riquadro "qcard"
// intorno: serve nei punti (come Carica certificato) dove il contenuto
// finisce comunque dentro un qcard già aperto da chi chiama.
function identitaGiocatoreCardHtml(bare) {
  if (giocatoriCache === null) { fetchGiocatori(); }
  var opzioniHtml;
  if (giocatoriCache === null || giocatoriCache === 'loading') {
    opzioniHtml = '<p style="color:var(--ink-muted);margin:0;">Caricamento elenco giocatori&hellip;</p>';
  } else if (giocatoriCache.error) {

    opzioniHtml = '<p style="color:var(--ink-muted);margin:0;">Nessun giocatore trovato nel database.</p>';

    var opzioni = '<option value="">Scelga il Suo nome&hellip;</option>' + giocatoriCache.map(function (g) {

    '<span class="field-label">Chi &egrave;?</span>' +

// ---------- utilità ----------

// I nomi di squadre e giocatori arrivano dal database: li "puliamo" prima
// di inserirli nella pagina, così anche un nome con caratteri strani non
// rompe la grafica.
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

// Mostra un messaggio in basso allo schermo per pochi secondi, poi lo
// fa sparire da solo (per esempio "Giocatore aggiunto"). "tipo" può
// essere 'ok' (normale) oppure 'errore' (sfondo rosso).
function mostraToast(messaggio, tipo) {
  var contenitore = document.getElementById('toast-container');
  if (!contenitore) return;
  var elemento = document.createElement('div');
  elemento.className = 'toast' + (tipo === 'errore' ? ' toast-errore' : '');
  elemento.textContent = messaggio;
  contenitore.appendChild(elemento);
  // Un errore resta un po' di più (il messaggio è più lungo e serve
  // tempo per leggerlo), un avviso normale sparisce prima.
  var durata = tipo === 'errore' ? 8000 : 4000;
  // Piccolo ritardo prima di aggiungere la classe che lo rende visibile,
  // altrimenti la transizione (dissolvenza) non si vedrebbe.
  setTimeout(function () { elemento.classList.add('toast-visibile'); }, 10);
  setTimeout(function () {
    elemento.classList.remove('toast-visibile');
    setTimeout(function () {
      if (elemento.parentNode) elemento.parentNode.removeChild(elemento);
    }, 300);
  }, durata);
}
