}

function statusInfo(stato) {
  if (stato === 'approvato') return { label: 'Approvato', cls: 'badge badge-ok', style: '' };
  if (stato === 'scartato') return { label: 'Scartato', cls: 'badge', style: 'border-color:var(--late);color:var(--late);' };
  return { label: 'Caricato', cls: 'badge badge-pending', style: '' };
}

// Pallino colorato in base alla scadenza del certificato (indipendente
// dallo stato di approvazione): rosso se è già scaduto, arancione se
// scade entro due mesi, verde se è ancora valido a lungo. Se non c'è
// una data di scadenza (certificati vecchi, caricati prima di questa
// funzione) non restituisce nessun pallino.
function scadenzaInfo(dataScadenza) {
  if (!dataScadenza) return null;
  var scadenza = new Date(dataScadenza + 'T00:00:00');
  if (isNaN(scadenza.getTime())) return null;

  var oggi = new Date();
  oggi.setHours(0, 0, 0, 0);

  var fraDueMesi = new Date(oggi);
  fraDueMesi.setMonth(fraDueMesi.getMonth() + 2);

  if (scadenza < oggi) return { cls: 'status-dot-late', label: 'Scaduto' };
  if (scadenza <= fraDueMesi) return { cls: 'status-dot-warn', label: 'In scadenza' };
  return { cls: 'status-dot-ok', label: 'Valido' };
}

// Trova, dentro la cache già caricata, la voce di un giocatore
// (con il suo certificato "nuovo" e/o "attuale"), a partire dal suo id.
function trovaVoceCertificati(giocatoreId) {
  if (!certificatiCache || !certificatiCache.length) return null;
  return certificatiCache.filter(function (p) {
    return p.giocatore && String(p.giocatore.id) === String(giocatoreId);
  })[0] || null;
}

// Blocco per scartare un certificato già approvato (per errore): se il
// modulo per il motivo non è ancora aperto, mostra solo il pulsante che
// lo apre; una volta aperto, mostra la casella di testo obbligatoria e
// i pulsanti Annulla/Conferma. Il motivo è obbligatorio: a differenza
// di certReject() (per un certificato ancora in attesa), qui si sta
// annullando qualcosa che era già stato approvato, quindi va spiegato.
function revocaCertificatoBloccoHtml(certId) {
  if (certRevocaApertaId !== certId) {
    return '' +
      '<div class="detail-actions" style="max-width:none;">' +
        '<span class="btn-reject" onclick="apriRevocaCertificato(' + certId + ')">Scarta comunque</span>' +
      '</div>';
  }

  return '' +
    '<div style="margin-top:4px;padding-top:14px;border-top:1px solid var(--border);">' +
      '<span class="field-label">Motivo dello scarto</span>' +
      '<textarea oninput="onRevocaCertificatoMotivoChange(event)" placeholder="Scriva perch&eacute; questo certificato, gi&agrave; approvato, va scartato&hellip;" style="width:100%;min-height:70px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);font-size:.88rem;font-family:inherit;background:var(--surface);color:var(--ink);resize:vertical;margin-top:6px;">' + escapeHtml(certRevocaMotivo) + '</textarea>' +
      (certRevocaErrore ? '<p style="color:var(--late);font-size:.82rem;margin-top:6px;">' + escapeHtml(certRevocaErrore) + '</p>' : '') +
      '<div class="detail-actions" style="max-width:none;margin-top:10px;">' +
        '<span class="btn-reject" onclick="annullaRevocaCertificato()">Annulla</span>' +
        '<span class="btn-approve" style="background:var(--late);border-color:var(--late);" onclick="confermaRevocaCertificato(' + certId + ')">' + (certRevocaInviando ? 'Invio in corso&hellip;' : 'Conferma scarto') + '</span>' +
      '</div>' +
    '</div>';
}

// Costruisce il blocco "foto + descrizione" di uno dei due lati del
// confronto (il certificato nuovo, oppure quello attuale). Se non c'è
// nessun certificato di quel tipo per il giocatore, mostra solo un
// messaggio al posto della foto e delle informazioni.
function blocchettoCertificato(cert, etichetta, fotoUrl, fotoLoading, testoVuoto, mostraAzioni, mostraRevoca) {
  var fotoHtml;
  if (!cert) {
    fotoHtml = '<div class="doc-preview">' + ICONS.docBig + '<span style="font-size:.85rem;text-align:center;padding:0 16px;">' + testoVuoto + '</span></div>';
  } else if (fotoLoading) {
    fotoHtml = '<div class="doc-preview">' + ICONS.docBig + '<span style="font-size:.85rem;">Caricamento foto&hellip;</span></div>';
  } else if (fotoUrl && urlEDocumentoPdf(fotoUrl)) {
    fotoHtml = '<div class="doc-preview" style="cursor:pointer;" title="Apri il PDF in una nuova scheda" onclick=\'apriFotoCertificato(' + JSON.stringify(fotoUrl) + ')\'>' + ICONS.docBig + '<span style="font-size:.85rem;text-align:center;padding:0 16px;">Certificato in PDF<br>tocca per aprirlo</span></div>';
  } else if (fotoUrl) {
    fotoHtml = '<img src="' + fotoUrl + '" alt="Certificato medico" style="width:100%;border-radius:20px;border:1px solid var(--border);display:block;cursor:pointer;" title="Clicchi per vedere il documento a schermo intero" onclick=\'apriFotoCertificato(' + JSON.stringify(fotoUrl) + ')\'>';
  } else {
    fotoHtml = '<div class="doc-preview">' + ICONS.docBig + '<span style="font-size:.85rem;">Foto non disponibile</span></div>';
  }

  var descrizioneHtml;
  if (!cert) {
    descrizioneHtml = '' +
      '<h3 style="font-size:.8rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:0;">' + etichetta + '</h3>' +
      '<p style="color:var(--ink-muted);font-size:.88rem;margin:10px 0 0;">' + testoVuoto + '</p>';
  } else {
    var info = statusInfo(cert.stato);
    var scad = scadenzaInfo(cert.data_scadenza);
    var statoValoreHtml = '' +
      '<span class="' + info.cls + '" style="' + info.style + '">' + info.label + '</span>' +
      (scad ? ' &nbsp;<span class="status-dot ' + scad.cls + '" style="display:inline-block;vertical-align:middle;" title="' + scad.label + '"></span> ' + scad.label : '');
    var notaValoreHtml = notaTroncataHtml(cert.nota, 40);

    // "Scarta comunque" solo se il certificato è valido (pallino verde):
    // se è già in scadenza o scaduto, il giocatore può già caricarne uno
    // nuovo da sé (vedi POST /api/certificati), quindi non serve questa
    // scorciatoia; resta invece utile per un certificato ancora valido a
    // lungo, approvato per errore, che altrimenti resterebbe "attuale"
    // per mesi. Se il certificato non ha nessuna data di scadenza (i più
    // vecchi, caricati prima che esistesse questo controllo) il pulsante
    // resta comunque visibile, per non bloccare quei casi.
    var certificatoValido = !scad || scad.cls === 'status-dot-ok';
    var mostraRevocaOra = !!(mostraRevoca && cert.stato === 'approvato' && certificatoValido);

    descrizioneHtml = '' +
      '<h3 style="font-size:.8rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;margin:0;">' + etichetta + '</h3>' +
      rigaDettaglio('Stato', statoValoreHtml) +
      rigaDettaglio('Nota di chi ha caricato il certificato', notaValoreHtml) +
      rigaDettaglio('Data di rilascio', cert.data_rilascio ? formattaDataBreve(cert.data_rilascio) : '') +
      rigaDettaglio('Data di scadenza', cert.data_scadenza ? formattaDataBreve(cert.data_scadenza) : '') +
      rigaDettaglio('Caricato il', formattaData(cert.data_caricamento)) +
      rigaDettaglio('Approvato il', cert.data_approvazione ? formattaData(cert.data_approvazione) : '') +
      (cert.stato === 'scartato' ? rigaDettaglio('Scartato il', cert.data_scarto ? formattaData(cert.data_scarto) : '') : '') +
      (cert.stato === 'scartato' ? rigaDettaglio('Motivo dello scarto', notaTroncataHtml(cert.motivo_scarto, 40)) : '') +
      (mostraAzioni
        ? '<div class="detail-actions" style="max-width:none;">' +
            '<span class="btn-reject" onclick="certReject()">Scarta</span>' +
            '<span class="btn-approve" onclick="certApprove()">Approva</span>' +
          '</div>'
        : '') +
      (mostraRevocaOra ? revocaCertificatoBloccoHtml(cert.id) : '');
  }

  // Un solo riquadro (paragrafo) per lato, non due affiancati: la foto
  // e tutta la sua descrizione stanno insieme dentro la stessa scheda
  // "qcard". flex-wrap:nowrap (diverso dalla riga più esterna, che può
  // impilare "nuovo" sopra "attuale" su schermi stretti): dentro la
  // scheda, foto e descrizione restano sempre affiancate, mai una sopra
  // l'altra. Entrambe hanno una dimensione fissa: se lo spazio non
  // basta, la scheda scorre in orizzontale invece di deformarsi.
  return '' +
    '<div class="qcard" style="flex:1 1 380px;flex-direction:row;align-items:flex-start;gap:16px;flex-wrap:nowrap;overflow-x:auto;">' +
      '<div style="flex:0 0 160px;width:160px;">' + fotoHtml + '</div>' +
      '<div style="flex:0 0 260px;width:260px;display:flex;flex-direction:column;gap:14px;">' + descrizioneHtml + '</div>' +
    '</div>';
}

// Apre la foto di un certificato ingrandita e centrata sopra la
// pagina stessa (non in una finestra a parte): clicca in un punto
// qualsiasi, o premi Esc, per richiuderla. Usata dal click sulla foto
// in blocchettoCertificato.
// Un certificato caricato come PDF non è una "foto": lo riconosciamo
// dall'estensione del file nel link temporaneo (che il server genera
// a partire dal percorso salvato, sempre con l'estensione giusta —
// vedi erroreFotoCertificato). Un PDF non si può mostrare dentro un
// tag immagine: si apre invece in una nuova scheda, lasciando che sia
// il browser a mostrarlo con il suo visualizzatore.
function urlEDocumentoPdf(url) {
  if (!url) return false;
  return /\.pdf(\?|$)/i.test(url);
}

function apriFotoCertificato(url) {
  if (!url) return;

  if (urlEDocumentoPdf(url)) {
    window.open(url, '_blank', 'noopener');
    return;
  }

  var sfondo = document.createElement('div');
  sfondo.setAttribute(
    'style',
    'position:fixed;inset:0;z-index:9999;background:rgba(250,250,250,.6);' +
      'backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);' +
      'display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;'
  );

  var img = document.createElement('img');
  img.src = url;
  img.alt = 'Certificato medico';
  img.setAttribute(
    'style',
    'max-width:min(720px,92vw);max-height:88vh;border-radius:12px;border:1px solid var(--border);' +
      'box-shadow:0 10px 40px rgba(0,0,0,.25);cursor:default;'
  );
  img.addEventListener('click', function (e) { e.stopPropagation(); });
  sfondo.appendChild(img);

  function chiudi() {
    sfondo.remove();
    document.removeEventListener('keydown', suEsc);
  }
  function suEsc(e) {
    if (e.key === 'Escape') chiudi();
  }

  sfondo.addEventListener('click', chiudi);
  document.addEventListener('keydown', suEsc);
  document.body.appendChild(sfondo);
}

// Se la nota è più lunga di "limite" caratteri, la mostra troncata e
// accanto ci mette un pulsante con tre puntini: cliccandolo si apre la
// nota per intero (vedi apriNotaCompleta più sotto), così una nota
// lunga non allunga o sforma la riga o la scheda dove sta scritta. Se
// è già abbastanza corta, la mostra tutta senza nessun pulsante.
function notaTroncataHtml(nota, limite) {
  if (!nota) return '';
  limite = limite || 80;
  if (nota.length <= limite) {
    return '<span style="white-space:pre-wrap;overflow-wrap:anywhere;">' + escapeHtml(nota) + '</span>';
  }
  var breve = escapeHtml(nota.slice(0, limite).trim());
  return '' +
    '<span style="white-space:pre-wrap;overflow-wrap:anywhere;">' + breve + '</span> ' +
    '<button type="button" style="' +
      'display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;' +
      'min-width:26px;height:20px;padding:0 6px;border-radius:999px;border:1.5px solid var(--border);' +
      'background:var(--surface);color:var(--ink-muted);font-weight:800;font-size:.8rem;' +
      'font-family:inherit;line-height:1;cursor:pointer;" ' +
    'title="Leggi tutta la nota" onclick=\'event.stopPropagation();apriNotaCompleta(' +
    JSON.stringify(nota) + ')\'>&hellip;</button>';
}

// Apre il testo completo di una nota, ingrandito e centrato sopra la
// pagina (stesso comportamento della foto, vedi apriFotoCertificato
// sopra): clicca fuori, o premi Esc, per richiuderla.
function apriNotaCompleta(nota) {
  var sfondo = document.createElement('div');
  sfondo.setAttribute(
    'style',
    'position:fixed;inset:0;z-index:9999;background:rgba(250,250,250,.6);' +
      'backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);' +
      'display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;'
  );

  var scatola = document.createElement('div');
  scatola.setAttribute(
    'style',
    'max-width:min(480px,90vw);max-height:80vh;overflow:auto;background:var(--surface);' +
      'border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.25);' +
      'white-space:pre-wrap;font-size:.92rem;line-height:1.6;cursor:default;'
  );
  scatola.textContent = nota;
  scatola.addEventListener('click', function (e) { e.stopPropagation(); });
  sfondo.appendChild(scatola);

  function chiudi() {
    sfondo.remove();
    document.removeEventListener('keydown', suEsc);
  }
  function suEsc(e) {
    if (e.key === 'Escape') chiudi();
  }

  sfondo.addEventListener('click', chiudi);
  document.addEventListener('keydown', suEsc);
  document.body.appendChild(sfondo);
}

function viewCertificatoApprovazione() {
  // Chi è entrato come Giocatore vede solo il proprio certificato, non
  // l'elenco di tutti i giocatori: pagina dedicata, senza azioni di
  // approvazione (quelle restano solo per l'Admin).
  if (accesso && accesso.ruolo === 'giocatore') { return viewCertificatoGestioneGiocatore(); }

  if (certificatiCache === null) { fetchCertificati(); }

  if (certView === 'detail') {
    var trovato = trovaVoceCertificati(certSelectedId);

    if (!trovato) {
      return '' +
      '<section class="wrap" style="padding-top:40px;padding-bottom:56px;">' +
        '<div class="back-link" onclick="certBack()">' + ICONS.arrowLeft + ' Torna all\'elenco</div>' +
        '<p style="color:var(--ink-muted);">Caricamento&hellip;</p>' +
      '</section>';
    }

    var nomeCompleto = trovato.giocatore ? (trovato.giocatore.cognome + ' ' + trovato.giocatore.nome) : 'Giocatore';

    var nuovoHtml = blocchettoCertificato(
      trovato.nuovo, 'Nuovo certificato',
      certDetailFotoNuovoUrl, certDetailFotoNuovoLoading,
      'Nessun nuovo certificato caricato.',
      !!trovato.nuovo
    );
    var correnteHtml = blocchettoCertificato(
      trovato.corrente, 'Certificato attuale',
      certDetailFotoCorrenteUrl, certDetailFotoCorrenteLoading,
      'Nessun certificato attuale registrato.',
      false,
      true
    );

    return '' +
    '<section class="wrap" style="padding-top:40px;padding-bottom:56px;">' +
      '<div class="back-link" onclick="certBack()">' + ICONS.arrowLeft + ' Torna all\'elenco</div>' +
      '<span class="eyebrow-pill">Certificato medico</span>' +
      '<h1 style="font-size:1.8rem;">' + escapeHtml(nomeCompleto) + '</h1>' +
      '<div style="display:flex;align-items:stretch;gap:16px;flex-wrap:nowrap;overflow-x:auto;margin-top:20px;padding-bottom:4px;">' +
        nuovoHtml +
        '<div style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);min-width:30px;">' + ICONS.arrowRightBig + '</div>' +
        correnteHtml +
      '</div>' +
    '</section>';
  }

  var body;
  var ricercaHtml = '';
  var pending = 0;
  if (certificatiCache === null || certificatiCache === 'loading') {
    body = '<p style="color:var(--ink-muted);">Caricamento certificati dal database&hellip;</p>';
  } else if (certificatiCache.error) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Certificati non disponibili.</strong> Non &egrave; stato possibile leggere i certificati dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else if (!certificatiCache.length) {
    body = '<div class="qcard">Nessun certificato caricato finora.</div>';
  } else {
    pending = certificatiCache.filter(function (p) { return !!p.nuovo; }).length;
    ricercaHtml = barraRicerca('ricercaGestioneInput', gestioneRicerca, 'onRicercaGestioneChange', 'Cerca giocatore per nome o cognome&hellip;');

    var elenco = certificatiCache;
    var testoRicerca = gestioneRicerca.trim().toLowerCase();
    if (testoRicerca) {
      elenco = elenco.filter(function (p) {
        var nome = p.giocatore ? (p.giocatore.cognome + ' ' + p.giocatore.nome) : '';
        return nome.toLowerCase().indexOf(testoRicerca) !== -1;
      });
    }

    if (!elenco.length) {
      body = '<div class="qcard">Nessun giocatore trovato per questa ricerca.</div>';
    } else {
    var rows = elenco.map(function (p) {
      var nomeCompleto = p.giocatore ? (p.giocatore.cognome + ' ' + p.giocatore.nome) : 'Giocatore';
      // Chi non ha mai caricato nessun certificato è messo allo stesso
      // livello di urgenza di chi ne ha uno scaduto (vale anche per
      // l'ordinamento, vedi giorniAllaScadenza sul server): stesso
      // pallino rosso, per farlo notare subito.
      var scad = p.corrente ? scadenzaInfo(p.corrente.data_scadenza) : { cls: 'status-dot-late', label: 'Nessun certificato' };
      var badgeHtml;
      var sottotitolo;
      if (p.nuovo) {
        badgeHtml = '<span class="badge badge-pending">Caricato</span>';
        sottotitolo = 'Nuovo certificato caricato il ' + formattaData(p.nuovo.data_caricamento);
      } else if (!p.corrente) {
        badgeHtml = '<span class="badge badge-none">In attesa</span>';
        sottotitolo = 'Deve ancora caricare un certificato.';
      } else if (scad && scad.cls === 'status-dot-late') {
        badgeHtml = '<span class="badge badge-none">In attesa</span>';
        sottotitolo = 'Il certificato &egrave; scaduto il ' + formattaDataBreve(p.corrente.data_scadenza) + ': deve caricarne uno nuovo.';
      } else if (scad && scad.cls === 'status-dot-warn') {
        badgeHtml = '<span class="badge badge-none">In attesa</span>';
        sottotitolo = 'Il certificato scade il ' + formattaDataBreve(p.corrente.data_scadenza) + ': pu&ograve; caricarne uno nuovo.';
      } else {
        badgeHtml = '<span class="badge badge-ok">Approvato</span>';
        sottotitolo = 'Caricato il ' + formattaData(p.corrente.data_caricamento) + (p.corrente.data_scadenza ? ' &middot; Scade il ' + formattaDataBreve(p.corrente.data_scadenza) : '');
      }
      return '' +
      '<div class="qcard cert-row cert-row-clickable" style="flex-direction:row;" onclick="certOpen(' + p.giocatore.id + ')">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(nomeCompleto) + '</div>' +
        '<div style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;">' + sottotitolo + '</div>' +
        '<div class="right-cluster">' +
          (scad ? '<span class="status-dot ' + scad.cls + '" title="' + scad.label + '"></span>' : '') +
          badgeHtml +
          ICONS.chevron +
        '</div>' +
      '</div>';
    }).join('');
    body = '<div class="list">' + rows + '</div>';
    }
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'certificati\')">' + ICONS.arrowLeft + ' Torna a Certificati medici</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Certificati medici</span><h1 style="font-size:2rem;">Gestione</h1></div>' +
    '<span class="badge badge-pending">' + pending + ' da valutare</span>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + ricercaHtml + body + '</section>';
}

// Versione di "Gestione" per chi è entrato come Giocatore: niente
// elenco di tutti i giocatori e niente pulsanti Approva/Scarta (quelli
// restano solo per l'Admin), solo il proprio certificato con la sua
// descrizione.
function viewCertificatoGestioneGiocatore() {
  if (giocatoriCache === null) { fetchGiocatori(); }
  if (certificatiCache === null) { fetchCertificati(); }

  var caricamento = (giocatoriCache === null || giocatoriCache === 'loading' || certificatiCache === null || certificatiCache === 'loading');
  var erroreCaricamento = !!((giocatoriCache && giocatoriCache.error) || (certificatiCache && certificatiCache.error));

  var body;
  if (caricamento) {
    body = '<p style="color:var(--ink-muted);">Caricamento del Suo certificato&hellip;</p>';
  } else if (erroreCaricamento) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Non disponibile.</strong> Non &egrave; stato possibile leggere i dati dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else {
    var mioGiocatore = giocatoreLoggato();
    if (!mioGiocatore) {
      body = identitaGiocatoreCardHtml();
    } else {
      var trovato = trovaVoceCertificati(mioGiocatore.id);
      // In Gestione si vede solo il certificato "corrente" (quello già
      // approvato): un eventuale nuovo certificato appena caricato non
      // deve comparire qui, perché deve ancora essere approvato
      // dall'Admin. Compare in Gestione solo dopo l'approvazione.
      var certDaMostrare = trovato ? trovato.corrente : null;

      var badgeHtml;
      var testoVuoto;
      if (trovato && trovato.corrente) {
        var scad = scadenzaInfo(trovato.corrente.data_scadenza);
        badgeHtml = (scad && (scad.cls === 'status-dot-late' || scad.cls === 'status-dot-warn'))
          ? '<span class="badge badge-none">In attesa: da caricarne uno nuovo</span>'
          : '<span class="badge badge-ok">Approvato</span>';
        testoVuoto = 'Non ha ancora caricato nessun certificato medico.';
      } else if (trovato && trovato.nuovo) {
        // Ha già caricato un certificato, ma è ancora da approvare: qui
        // non mostriamo i suoi dettagli (non è ancora quello "in uso"),
        // solo un messaggio che spiega perché non c'è ancora nulla.
        badgeHtml = '<span class="badge badge-pending">In attesa di approvazione</span>';
        testoVuoto = 'Ha caricato un certificato: è in attesa di essere approvato dall\'Admin. Comparir&agrave; qui non appena verr&agrave; approvato.';
      } else {
        badgeHtml = '<span class="badge badge-none">In attesa: da caricare un certificato</span>';
        testoVuoto = 'Non ha ancora caricato nessun certificato medico.';
      }

      // Richiediamo la foto del certificato da mostrare una sola volta
      // (finché non cambia): stesso meccanismo usato da certOpen() per
      // l'Admin, ma innescato qui automaticamente invece che da un click.
      if (certDaMostrare && certGiocatoreFotoCertId !== certDaMostrare.id) {
        certGiocatoreFotoCertId = certDaMostrare.id;
        certDetailFotoCorrenteUrl = null;
        certDetailFotoCorrenteLoading = true;
        fetch('/api/certificati/' + encodeURIComponent(certDaMostrare.id) + '/foto')
          .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
          .then(function (data) { certDetailFotoCorrenteUrl = data.url; certDetailFotoCorrenteLoading = false; render(); })
          .catch(function () { certDetailFotoCorrenteLoading = false; render(); });
      } else if (!certDaMostrare) {
        certGiocatoreFotoCertId = null;
      }

      var blocco = blocchettoCertificato(
        certDaMostrare,
        'Il Suo certificato',
        certDetailFotoCorrenteUrl,
        certDetailFotoCorrenteLoading,
        testoVuoto,
        false
      );

      body = '' +
        '<div style="margin-bottom:16px;">' + badgeHtml + '</div>' +
        '<div style="display:flex;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;">' + blocco + '</div>';
    }
  }

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'certificati\')">' + ICONS.arrowLeft + ' Torna a Certificati medici</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Certificati medici</span><h1 style="font-size:2rem;">Gestione</h1>' +
    '<p class="subtitle">Il Suo certificato medico.</p></div>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + body + '</section>';
}

// Pagina "Archivio": a differenza di "Gestione" (che mostra solo
// l'ultimo stato di ogni giocatore) qui vediamo la storia completa di
// TUTTI i certificati caricati finora, divisi in tre gruppi: quelli da
// approvare, quelli approvati (il certificato attuale di ciascun
// giocatore, valido o scaduto che sia) e quelli archiviati (i
// certificati approvati che non sono più quello attuale, perché nel
// frattempo il giocatore ne ha caricato e fatto approvare uno più
// recente).
function viewCertificatoArchivio() {
  if (archivioCache === null) { fetchArchivioCertificati(); }

  // Chi è entrato come Giocatore vede solo i propri certificati: per
  // capire quali sono ci serve anche l'elenco dei giocatori, per
  // trovare il proprio id a partire dal nome e cognome scritti in fase
  // di accesso.
  var perGiocatore = !!(accesso && accesso.ruolo === 'giocatore');
  if (perGiocatore && giocatoriCache === null) { fetchGiocatori(); }

  var body;
  var filtriHtml = '';
  var ricercaHtml = '';
  if (archivioCache === null || archivioCache === 'loading' || (perGiocatore && (giocatoriCache === null || giocatoriCache === 'loading'))) {
    body = '<p style="color:var(--ink-muted);">Caricamento archivio dal database&hellip;</p>';
  } else if (archivioCache.error || (perGiocatore && giocatoriCache.error)) {
    body = '<div class="qcard"><span><strong>&#9888;&#65039; Archivio non disponibile.</strong> Non &egrave; stato possibile leggere i certificati dal server: verificare che il server sia avviato e collegato al database.</span></div>';
  } else {
    var elencoVisibile = archivioCache;
    var mioGiocatore = null;

    if (perGiocatore) {
      mioGiocatore = giocatoreLoggato();
      if (!mioGiocatore) {
        elencoVisibile = null; // segnale: giocatore non trovato, vedi sotto
      } else {
        elencoVisibile = archivioCache.filter(function (c) { return String(c.id_giocatore) === String(mioGiocatore.id); });
      }
    }

    // La barra di ricerca è solo per l'Admin: chi è entrato come
    // Giocatore vede già solo i propri certificati, cercare per nome
    // non avrebbe senso.
    var testoRicercaArchivio = '';
    if (!perGiocatore) {
      ricercaHtml = barraRicerca('ricercaArchivioInput', archivioRicerca, 'onRicercaArchivioChange', 'Cerca giocatore per nome o cognome&hellip;');
      testoRicercaArchivio = archivioRicerca.trim().toLowerCase();
      if (testoRicercaArchivio) {
        elencoVisibile = elencoVisibile.filter(function (c) {
          var nome = ((c.cognome || '') + ' ' + (c.nome || ''));
          return nome.toLowerCase().indexOf(testoRicercaArchivio) !== -1;
        });
      }
    }

    if (perGiocatore && !mioGiocatore) {
      body = identitaGiocatoreCardHtml();
    } else if (!elencoVisibile.length) {
      body = '<div class="qcard">' + (testoRicercaArchivio ? 'Nessun certificato trovato per questa ricerca.' : (perGiocatore ? 'Non ha ancora caricato nessun certificato.' : 'Nessun certificato caricato finora.')) + '</div>';
    } else {
      // Per ogni giocatore, il certificato "attuale" è quello approvato
      // più di recente: tutti gli altri suoi certificati approvati (più
      // vecchi, sostituiti da questo) finiscono tra gli archiviati. I
      // certificati di un giocatore che è stato eliminato (e quindi
      // archiviato, vedi DELETE /api/giocatori/:id) finiscono tutti tra
      // gli archiviati, qualsiasi sia il loro stato. Lo stesso vale per
      // i certificati caricati PRIMA che il giocatore venisse
      // ripristinato (vedi PUT /api/giocatori/:id): anche se ora è di
      // nuovo attivo, quei vecchi certificati restano per sempre tra
      // gli archiviati.
      var ultimaApprovazionePerGiocatore = {};
      elencoVisibile.forEach(function (c) {
        if (c.giocatore_archiviato || c.precedente_al_ripristino || c.stato !== 'approvato') return;
        var precedente = ultimaApprovazionePerGiocatore[c.id_giocatore];
        if (!precedente || new Date(c.data_approvazione || 0) > new Date(precedente)) {
          ultimaApprovazionePerGiocatore[c.id_giocatore] = c.data_approvazione;
        }
      });

      var daApprovare = [];
      var approvati = [];
      var archiviati = [];
      var scartati = [];

      elencoVisibile.forEach(function (c) {
        if (c.giocatore_archiviato || c.precedente_al_ripristino) {
          archiviati.push(c);
        } else if (c.stato === 'scartato') {
          // Un certificato scartato dopo essere stato approvato (vedi
          // "Scarta comunque" nella pagina Gestione): resta qui, non
          // tra i "Da approvare", che sono solo quelli ancora in attesa.
          scartati.push(c);
        } else if (c.stato !== 'approvato') {
          daApprovare.push(c);
        } else if (c.data_approvazione === ultimaApprovazionePerGiocatore[c.id_giocatore]) {
          approvati.push(c);
        } else {
          archiviati.push(c);
        }
      });

      filtriHtml = '' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px;">' +
          filtroArchivioBtn('tutti', 'Tutti', daApprovare.length + approvati.length + archiviati.length + scartati.length) +
          filtroArchivioBtn('da_approvare', 'Da approvare', daApprovare.length) +
          filtroArchivioBtn('approvati', 'Approvati', approvati.length) +
          filtroArchivioBtn('archiviati', 'Archiviati', archiviati.length) +
          filtroArchivioBtn('scartati', 'Scartati', scartati.length) +
        '</div>';

      body = '' +
        (archivioFiltro === 'tutti' || archivioFiltro === 'da_approvare'
          ? sezioneArchivio('Da approvare', daApprovare, 'Nessun certificato in attesa di essere valutato.', false) : '') +
        (archivioFiltro === 'tutti' || archivioFiltro === 'approvati'
          ? sezioneArchivio('Approvati', approvati, 'Nessun certificato approvato e ancora valido.') : '') +
        (archivioFiltro === 'tutti' || archivioFiltro === 'archiviati'
          ? sezioneArchivio('Archiviati', archiviati, 'Nessun certificato archiviato: nessun giocatore ha ancora sostituito un certificato approvato con uno più recente.', false) : '') +
        (archivioFiltro === 'tutti' || archivioFiltro === 'scartati'
          ? sezioneArchivio('Scartati', scartati, 'Nessun certificato scartato dopo essere stato approvato.', false) : '');
    }
  }

  var sottotitolo = perGiocatore
    ? 'Tutti i Suoi certificati caricati finora, divisi per stato. Clicchi su una riga per vedere la foto.'
    : 'Tutti i certificati caricati finora, divisi per stato. Clicchi su una riga per vedere la foto.';

  return '' +
  '<section class="wrap" style="padding-top:40px;">' +
    '<div class="back-link" onclick="navigate(\'certificati\')">' + ICONS.arrowLeft + ' Torna a Certificati medici</div>' +
  '</section>' +
  '<section class="wrap"><div class="page-title">' +
    '<div><span class="eyebrow-pill">Certificati medici</span><h1 style="font-size:2rem;">Archivio</h1>' +
    '<p class="subtitle">' + sottotitolo + '</p></div>' +
  '</div></section>' +
  '<section class="wrap" style="padding-bottom:56px;">' + ricercaHtml + filtriHtml + body + '</section>';
}

// Uno dei pulsanti del filtro in cima all'Archivio: evidenziato se è
// quello selezionato al momento.
function filtroArchivioBtn(valore, etichetta, conteggio) {
  var attivo = archivioFiltro === valore;
  return '' +
    '<span class="pill' + (attivo ? ' pill-solid' : '') + '" style="cursor:pointer;" onclick=\'impostaFiltroArchivio(' +
      JSON.stringify(valore) + ')\'>' + escapeHtml(etichetta) + ' (' + conteggio + ')</span>';
}

function impostaFiltroArchivio(valore) {
  archivioFiltro = valore;
  render();
}

// Costruisce una delle tre sezioni dell'Archivio (titolo + elenco).
// mostraPallino=false toglie il pallino colorato di scadenza: si usa
// per gli "Archiviati", che non essendo più il certificato in uso di
// nessuno non hanno più bisogno di segnalare quanto manca alla scadenza.
function sezioneArchivio(titolo, elenco, testoVuoto, mostraPallino) {
  var corpo;
  if (!elenco.length) {
    corpo = '<div class="qcard" style="color:var(--ink-muted);">' + testoVuoto + '</div>';
  } else {
    corpo = '<div class="list">' + elenco.map(function (c) {
      var nomeCompleto = ((c.cognome || '') + ' ' + (c.nome || '')).trim() || 'Giocatore';
      var scad = (mostraPallino !== false && c.data_scadenza) ? scadenzaInfo(c.data_scadenza) : null;
      var dettagli = [];
      if (c.data_rilascio) dettagli.push('Rilascio ' + formattaDataBreve(c.data_rilascio));
      if (c.data_scadenza) dettagli.push('Scadenza ' + formattaDataBreve(c.data_scadenza));
      if (c.stato === 'scartato') {
        if (c.data_scarto) dettagli.push('Scartato il ' + formattaDataBreve(c.data_scarto));
        if (c.motivo_scarto) dettagli.push('Motivo: ' + escapeHtml(c.motivo_scarto));
      }
      return '' +
      '<div class="qcard cert-row cert-row-clickable" style="flex-direction:row;" onclick="vediFotoArchivio(' + c.id + ')">' +
        '<div style="font-weight:700;flex:0 0 200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escapeHtml(nomeCompleto) + '</div>' +
        '<div style="color:var(--ink-muted);font-size:.85rem;flex:1;min-width:0;">' + dettagli.join(' &middot; ') + '</div>' +
        '<div class="right-cluster">' +
          (scad ? '<span class="status-dot ' + scad.cls + '" title="' + scad.label + '"></span>' : '') +
          '<span class="qcard-link" style="margin:0;">' + ICONS.doc + ' Vedi foto</span>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  return '' +
  '<h3 style="font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted);margin:28px 0 12px;">' +
    escapeHtml(titolo) + ' <span style="color:var(--ink-soft);">(' + elenco.length + ')</span>' +
  '</h3>' + corpo;
}

// Recupera il link temporaneo alla foto di un certificato dell'Archivio
// e la mostra ingrandita (vedi apriFotoCertificato più sotto).
function vediFotoArchivio(idCertificato) {
  fetch('/api/certificati/' + encodeURIComponent(idCertificato) + '/foto')
    .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
    .then(function (data) { apriFotoCertificato(data.url); })
    .catch(function () { console.error('Non sono riuscito a recuperare la foto del certificato.'); });
}

// id qui è l'id del GIOCATORE (non del certificato): un giocatore può
// avere fino a due certificati (nuovo + attuale), quindi le loro foto
// si caricano separatamente, una per ciascuno.
function certOpen(id) {
  certView = 'detail';
  certSelectedId = id;
  certDetailFotoNuovoUrl = null;
  certDetailFotoNuovoLoading = false;
  certDetailFotoCorrenteUrl = null;
  certDetailFotoCorrenteLoading = false;
  certRevocaApertaId = null;
  certRevocaMotivo = '';
  certRevocaInviando = false;
  certRevocaErrore = null;

  var trovato = trovaVoceCertificati(id);

  if (trovato && trovato.nuovo) {
    certDetailFotoNuovoLoading = true;
    fetch('/api/certificati/' + encodeURIComponent(trovato.nuovo.id) + '/foto')
      .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
      .then(function (data) { certDetailFotoNuovoUrl = data.url; certDetailFotoNuovoLoading = false; render(); })
      .catch(function () { certDetailFotoNuovoLoading = false; render(); });
  }

  if (trovato && trovato.corrente) {
    certDetailFotoCorrenteLoading = true;
    fetch('/api/certificati/' + encodeURIComponent(trovato.corrente.id) + '/foto')
      .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
      .then(function (data) { certDetailFotoCorrenteUrl = data.url; certDetailFotoCorrenteLoading = false; render(); })
      .catch(function () { certDetailFotoCorrenteLoading = false; render(); });
  }

  render();
}
function certBack() {
  certView = 'list';
  certSelectedId = null;
  certDetailFotoNuovoUrl = null;
  certDetailFotoNuovoLoading = false;
  certDetailFotoCorrenteUrl = null;
  certDetailFotoCorrenteLoading = false;
  certRevocaApertaId = null;
  certRevocaMotivo = '';
  certRevocaInviando = false;
  certRevocaErrore = null;
  render();
}

// Approva il certificato "nuovo" del giocatore aperto: da questo
// momento diventa quello attuale.
function certApprove() {
  var trovato = trovaVoceCertificati(certSelectedId);
  if (!trovato || !trovato.nuovo) return;

  fetch('/api/certificati/' + encodeURIComponent(trovato.nuovo.id), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ stato: 'approvato' }),
  })
    .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
    .catch(function () { /* torniamo comunque all'elenco, che si rilegge subito dopo */ })
    .then(function () {
      certificatiCache = null;
      giocatoriCache = null; // il certificato attuale del giocatore è cambiato
      archivioCache = null;
      certBack();
    });
}

// Scarta il certificato "nuovo": viene eliminato del tutto, come se
// non fosse mai stato caricato. Il certificato attuale (se c'era) non
// viene toccato.
function certReject() {
  var trovato = trovaVoceCertificati(certSelectedId);
  if (!trovato || !trovato.nuovo) return;

  fetch('/api/certificati/' + encodeURIComponent(trovato.nuovo.id), { method: 'DELETE' })
    .then(function (res) { if (!res.ok) throw new Error('Richiesta non riuscita'); return res.json(); })
    .catch(function () { /* torniamo comunque all'elenco, che si rilegge subito dopo */ })
    .then(function () {
      certificatiCache = null;
      archivioCache = null;
      certBack();
    });
}

// Apre, sotto il certificato attuale (già approvato), il modulo per
// scrivere il motivo prima di scartarlo comunque: a differenza di
// certReject() (per un certificato ancora in attesa, dove non serve
// spiegare nulla), qui il motivo è obbligatorio, perché si sta
// annullando qualcosa che era già stato approvato.
function apriRevocaCertificato(id) {
  certRevocaApertaId = id;
  certRevocaMotivo = '';
  certRevocaErrore = null;
  render();
}

function annullaRevocaCertificato() {
  certRevocaApertaId = null;
  certRevocaMotivo = '';
  certRevocaErrore = null;
  render();
}

function onRevocaCertificatoMotivoChange(e) {
  certRevocaMotivo = e.target.value;
}

// Scarta un certificato GIÀ APPROVATO (per errore): a differenza di
// certReject(), qui il certificato non viene eliminato dal database,
// resta con stato "scartato" e il motivo scritto, così ne rimane
// traccia in Archivio. Da questo momento il giocatore non ha più un
// certificato attuale valido e può caricarne subito uno nuovo.
function confermaRevocaCertificato(id) {
  if (!(certRevocaMotivo || '').trim()) {
    certRevocaErrore = 'Scriva il motivo per cui questo certificato va scartato.';
    render();
    return;
  }

  certRevocaInviando = true;
  certRevocaErrore = null;
  render();

  fetch('/api/certificati/' + encodeURIComponent(id) + '/revoca', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ motivo: certRevocaMotivo.trim() }),
  })
    .then(function (res) {
      return res.json().then(function (corpo) {
        if (!res.ok) {
          var errore = new Error(corpo && corpo.errore ? corpo.errore : 'Richiesta non riuscita');
          errore.messaggioServer = corpo && corpo.errore;
          throw errore;
        }
        return corpo;
      });
    })
    .then(function () {
      certRevocaInviando = false;
      certificatiCache = null;
      giocatoriCache = null; // il giocatore non ha più un certificato attuale
      archivioCache = null;
      certBack();
    })
    .catch(function (errore) {
      certRevocaInviando = false;
      certRevocaErrore = (errore && errore.messaggioServer) ? errore.messaggioServer : 'Errore durante l\'operazione: riprovi.';
      render();
    });
}

// ---------- render principale ----------

function render() {
  // Il rendering ricrea sempre tutto l'HTML della pagina: senza questo
  // accorgimento, un campo di testo come la barra di ricerca perderebbe
  // il focus (e quindi non si potrebbe scrivere) a ogni carattere
  // digitato. Qui salviamo quale campo aveva il focus e la posizione
  // del cursore, per poi rimetterli a posto dopo aver ridisegnato tutto.
  var idDaRifocalizzare = document.activeElement && document.activeElement.id;
  var selInizio, selFine;
  if (idDaRifocalizzare && typeof document.activeElement.selectionStart === 'number') {
    selInizio = document.activeElement.selectionStart;
    selFine = document.activeElement.selectionEnd;
  }

  if (impostaPasswordAttiva) {
    document.getElementById('app').innerHTML = '<div style="width:100%;">' + viewImpostaPassword() + '</div>';
    return;
  }

  if (registrazioneAttiva) {
    document.getElementById('app').innerHTML = '<div style="width:100%;">' + viewRegistrazione() + '</div>';
    return;
  }

  if (!accessoControllato) {
    document.getElementById('app').innerHTML = '<div style="width:100%;padding:120px 20px;text-align:center;color:var(--ink-muted);">Caricamento&hellip;</div>';
    return;
  }

  if (!accesso) {
    document.getElementById('app').innerHTML = '<div style="width:100%;">' + viewAccesso() + '</div>';
    return;
  }

  var route = currentRoute();
  var section = route[0];
  var content = '';

  if (section === 'home') {
    content = viewHome();
  } else if (section === 'squadre' && route[1] === 'elenco') {
    content = viewSquadreElenco();
  } else if (section === 'squadre' && route[1] === 'giocatori') {
    content = viewSquadreGiocatori();
  } else if (section === 'squadre' && route[1]) {
    content = viewRosa(route[1]);
  } else if (section === 'squadre') {
    content = viewSquadreHub();
  } else if (section === 'contatti') {
    content = viewContatti();
  } else if (section === 'impostazioni') {
    content = viewImpostazioni();
  } else if (section === 'certificati' && route[1] === 'carica') {
    content = viewCertificatoCarica();
  } else if (section === 'certificati' && route[1] === 'approvazione') {
    content = viewCertificatoApprovazione();
  } else if (section === 'certificati' && route[1] === 'archivio') {
    content = (accesso && accesso.ruolo === 'admin') ? viewCertificatoArchivio() : viewCertificatiHub();
  } else if (section === 'certificati' && route[1] === 'segnalazioni') {
    content = (accesso && accesso.ruolo === 'admin') ? viewCertificatoSegnalazioni() : viewCertificatiHub();
  } else if (section === 'certificati') {
    content = viewCertificatiHub();
  } else {
    content = viewHome();
  }

  document.getElementById('app').innerHTML = '<div style="width:100%;">' + topbar(section) + content + footer() + '</div>';

  if (idDaRifocalizzare) {
    var elDaRifocalizzare = document.getElementById(idDaRifocalizzare);
    if (elDaRifocalizzare) {
      elDaRifocalizzare.focus();
      if (selInizio !== undefined && elDaRifocalizzare.setSelectionRange) {
        elDaRifocalizzare.setSelectionRange(selInizio, selFine);
      }
    }
  }
}

// Da qui in poi ogni richiesta a "/api/..." porta con sé il token
// dell'accesso corrente (se c'è): senza, il server la rifiuterebbe
// (vedi richiedeAccesso in server.js). Farlo qui, una volta sola,
// evita di dover modificare tutte le singole chiamate fetch('/api/...')
// sparse nel resto del file.
var fetchOriginale = window.fetch.bind(window);
window.fetch = function (url, opzioni) {
  opzioni = opzioni || {};
  if (typeof url === 'string' && url.indexOf('/api/') === 0 && tokenSessioneCorrente) {
    var intestazioni = {};
    for (var chiave in (opzioni.headers || {})) { intestazioni[chiave] = opzioni.headers[chiave]; }
    intestazioni.Authorization = 'Bearer ' + tokenSessioneCorrente;
    opzioni = Object.assign({}, opzioni, { headers: intestazioni });
  }
  return fetchOriginale(url, opzioni);
};

// Avvio del sito: prima di mostrare qualsiasi cosa, dobbiamo sapere a
// quale progetto Supabase collegarci (per il login) e se chi apre il
// sito ha già una sessione valida (ha già fatto accesso in passato e
// non ha ancora fatto "Esci").
function avviaApp() {
  fetch('/api/config')
    .then(function (res) { return res.json(); })
    .then(function (configurazione) {
      supabaseClient = window.supabase.createClient(configurazione.supabaseUrl, configurazione.supabaseAnonKey, {
        auth: {
          // Scriviamo qui per esteso valori che sarebbero comunque
          // quelli di default, per essere sicuri che restino questi
          // anche se in futuro cambiassero i default della libreria:
          // la sessione deve restare salvata (persistSession) e
          // rinnovarsi da sola quando sta per scadere
          // (autoRefreshToken). "detectSessionInUrl" resta disattivato
          // perché i link di invito/recupero password li leggiamo e
          // gestiamo già da soli qui sotto (leggiParametriInvito()):
          // lasciare che la libreria controlli anche lei lo stesso
          // indirizzo (che qui serve anche per le pagine del sito, per
          // esempio "#/certificati") è solo un rischio di interferenza
          // in più, senza nessun vantaggio.
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
        },
      });

      // Da qui in poi, ogni cambio della sessione (login, logout,
      // rinnovo automatico del token) aggiorna da solo "accesso".
      // Colleghiamo questo "ascoltatore" SUBITO, PRIMA dei controlli sul
      // link di registrazione o di invito qui sotto (che a volte escono
      // subito da questa funzione con "return"): se lo collegassimo
      // dopo, come succedeva prima, chi arrivava da uno di quei link non
      // avrebbe più nessuno che si accorge, più avanti, di quando fa
      // "Esci" — e il pulsante Esci smetteva di funzionare per lui.
      supabaseClient.auth.onAuthStateChange(function (evento, sessione) {
        // Finché il controllo iniziale (getSession() qui sotto, oppure
        // il completamento della schermata "Imposta password" o
        // "Registrati") non è terminato (accessoControllato ancora
        // false), ignoriamo le notifiche di questo listener: sia
        // getSession() sia questo listener vengono avvisati, all'avvio,
        // se c'è già una sessione salvata, e non è garantito chi dei
        // due arriva prima. Senza questa attesa, capitava che questo
        // listener arrivasse per secondo dicendo (per come si
        // inizializza la libreria, anche solo per un attimo) "nessuna
        // sessione", annullando un accesso che il controllo iniziale
        // aveva appena trovato valido: il risultato, per chi apriva o
        // aggiornava il sito con una sessione già salvata, era di
        // ritrovarsi comunque alla schermata di accesso.
        if (!impostaPasswordAttiva && !registrazioneAttiva && accessoControllato) {
          aggiornaAccessoDaSessione(sessione, 0, evento);
        }
      });

      // Chi arriva da un link "Aggiungi con link WhatsApp" (vedi
      // apriGiocatoreRapido() più sopra) ha, nel proprio indirizzo, il
      // token di registrazione: mostriamo subito la schermata apposita,
      // senza nessun controllo di sessione (non ne ha ancora una).
      var tokenRegistrazione = leggiTokenRegistrazione();
      if (tokenRegistrazione) {
        registrazioneToken = tokenRegistrazione;
        registrazioneAttiva = true;
        caricaDatiRegistrazione(tokenRegistrazione);
        return;
      }

      // Chi arriva da un link di invito o di recupero password ha, nel
      // proprio indirizzo, un token speciale: lo usiamo solo per la
      // pagina "Imposta la tua password", senza considerarlo ancora un
      // accesso vero e proprio al resto del sito.
      var parametriInvito = leggiParametriInvito();
      if (parametriInvito) {
        supabaseClient.auth.setSession({
          access_token: parametriInvito.accessToken,
          refresh_token: parametriInvito.refreshToken,
        }).then(function () {
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
          impostaPasswordAttiva = true;
          render();
        });
        return;
      }

      // Controlliamo ANCHE subito, qui, se c'è già una sessione salvata
      // da una visita precedente (chi ha già fatto login e non ha fatto
      // "Esci"): non ci basta fidarci che ci pensi da solo
      // onAuthStateChange qui sopra, perché non in tutti i casi la
      // richiama per una sessione già presente al primo avvio, e in
      // quel caso il sito continuerebbe a credere di non avere nessuna
      // sessione (mostrando la schermata di accesso anche a chi aveva
      // già fatto il login) finché non si rifà da capo il login a mano.
      supabaseClient.auth.getSession().then(function (risultato) {
        var sessione = risultato && risultato.data ? risultato.data.session : null;
        if (!impostaPasswordAttiva) { aggiornaAccessoDaSessione(sessione); }
      }).catch(function (errore) {
        console.error('Impossibile leggere la sessione salvata:', errore);
        if (!impostaPasswordAttiva) {
          accessoControllato = true;
          render();
        }
      });
    })
    .catch(function (errore) {
      console.error('Impossibile leggere la configurazione del sito:', errore);
      loginErrore = 'Il sito non riesce a collegarsi: riprovare più tardi.';
      render();
    });
}

avviaApp();
</script>
